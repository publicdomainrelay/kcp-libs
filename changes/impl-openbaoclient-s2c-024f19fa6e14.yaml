        id: r.sentinel-error-matching
        level: MUST
        text: ResponseError.Is maps HTTP 404 to ErrNotFound, HTTP 403 to ErrForbidden
          and an HTTP 400 that reports no default issuer as pki.ErrNoAuthority, and
          returns false for every other status, so callers can use errors.Is against
          the sentinels.
