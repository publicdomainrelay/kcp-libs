status:
  agentLog: The impl/informerwatch package runs Kubernetes dynamic shared informers
    over one or more kcp sources. A Source names a base URL and a list of Resource
    values (a Kind string plus a schema.GroupVersionResource). Run takes an Options
    value holding a *rest.Config, the Sources, optional cache.Indexers, an optional
    *cache.Set, an optional Reactor, an Enqueue function and an optional OnEvent callback.
    Run validates the options, builds one dynamic client per source through factoryClient
    (rewriting the host to the source base plus ref.APIPathPrefix), starts a filtered
    dynamic shared informer factory per source, registers an event handler for every
    Resource, waits for cache sync, then blocks until the context is done. The event
    handler enqueues the object itself via enqueueOwn (which uses cache.RefOf) and,
    when a Reactor is set, calls Reactor.Added on add and Reactor.Updated on update
    with the *unstructured.Unstructured forms.
