status:
  agentLog: 'The common/condition package is a small helper layer over Kubernetes
    metav1.Condition slices. It gives controllers seven functions: Copy for taking
    an independent snapshot of a condition list, Set for writing one condition of
    a given type with metadata, the SetTrue and SetFalse shorthands for the two boolean
    status values, Remove for deleting a condition by type, Of for looking one condition
    up by type, and Is for testing whether a condition of a given type currently carries
    a given status. All mutation happens through a pointer to the slice so the caller''s
    list is updated in place, and the package delegates the actual list maintenance
    to k8s.io/apimachinery meta.SetStatusCondition. Tests in condition_test.go cover
    set-and-is, removal, copy independence, and transition-time preservation.'
