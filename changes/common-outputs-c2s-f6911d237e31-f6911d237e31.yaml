status:
  agentLog: 'common/outputs is a tiny leaf package in kcp-libs that turns arbitrary
    Go values into strings. common/outputs/outputs.go exports two functions: StringifyValue
    converts one value to a string, returning strings untouched and JSON-encoding
    everything else, with fmt.Sprint as the fallback when marshalling fails; Stringify
    walks a map[string]any and applies StringifyValue to every value, returning nil
    for empty or nil input so callers can treat an absent result as an absent map.
    The package is used when Kubernetes-style outputs must be flattened into a plain
    string map: impl/execrunner/pod.go readOutputs calls Stringify, and impl/policyclient/policyclient.go
    Outputs calls StringifyValue per entry. common/outputs/outputs_test.go pins the
    behavior with TestStringify, which checks nil input, plain strings, numbers, booleans,
    and lists.'
