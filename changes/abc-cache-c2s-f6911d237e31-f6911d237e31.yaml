status:
  agentLog: 'abc/cache is the object cache layer of kcp-libs. It defines the Indexer
    interface (GetByKey, ByIndex, List) and a Set that holds many indexers per object
    kind. Callers register an Indexer under a kind with Set.Add; Set.Get asks each
    indexer in turn and returns the first hit, Set.List concatenates every indexer''s
    objects for a kind, Set.ByIndex concatenates the results of one named index across
    the indexers, and Set.Names maps those objects to names. Helper functions read
    common fields off unstructured objects: ClusterOf, RefOf, NameOf, PhaseOf and
    the generic NestedString field walker. IndexersFor builds the standard indexer
    set from a parent label, a job label and a trigger pod field. A test file exercises
    the Set against a fakeIndexer built on IndexersFor.'
