status:
  agentLog: 'abc/pki/pki.go is the abstract contract layer for certificate authority
    operations in kcp-libs. It declares plain data carriers (Cert, RootCA, IntermediateCSR,
    Role, CertRequest, Authority, Health), package-level defaults (DefaultMount, DefaultRole,
    DefaultRootCommonName, DefaultRootTTL, DefaultIntermediateTTL, DefaultLeafTTL)
    and the sentinel error ErrNoAuthority. Two interfaces carry the behavior: Client
    is the low-level store-facing surface that manages namespaces and mounts, generates
    roots and intermediates, writes roles and issues certificates; Provisioner is
    the higher-level, idempotent surface that ensures a root and an authority per
    path, issues leaves, deletes a path and exposes a cached root PEM. Implementations
    live outside this package, for example impl/openbaoclient and impl/pkiprovisioner.'
