status:
  agentLog: 'impl/execrunner is the real process-running implementation of the kcp-libs
    runner interfaces. It provides two entry points that satisfy runner.EngineRunner
    and runner.PodRunner by spawning a Deno runtime as an external process. Engine
    runs a long-lived server out of a ServerDir with a ServerFile (default main.ts)
    inside a RunsDir, while Pod runs a per-request script inside a NamespaceDir and
    can write a result file, carry CA data and a trust bundle. Both share a supervisor
    (impl/execrunner/supervisor.go) that owns run directories, process lifetime and
    timeouts. Options carry the Deno binary, extra environment, and an optional Timeout;
    construction resolves paths to absolute and validates required fields. pod_test.go
    exercises the engine and pod behaviour: defaulting and preserving the Deno directory,
    requiring a runs directory, never reaping a run without a deadline, enforcing
    a configured timeout, reporting the wait error on Stop, and leaving the caller''s
    namespace environment variable alone.'
