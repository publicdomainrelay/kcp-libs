status:
  agentLog: impl/assets holds the small asset-writing layer that materialises runtime
    files onto disk for the rest of kcp-libs. The Set struct in impl/assets/assets.go
    owns a target Dir, an in-memory Files map of name to bytes, an optional Perm mode,
    a mutex, a written flag, a paths cache and a sticky error. Set.Materialise writes
    the files once and caches the result, Set.Rewrite forces a write every call, and
    Set.Path resolves one file's on-disk path. impl/assets/dns.go builds a Set for
    the DNS workload through DNSSet, which joins the runs directory with DNSDirName
    and seeds the shim and probe sources from the embedded Shim and Probe assets;
    impl/assets/dnsshim.ts and impl/assets/dnsprobe.ts are those sources. Tests live
    in impl/assets/assets_test.go and impl/assets/dns_test.go.
