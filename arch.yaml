    signature: func (s *Store) MintServiceAccountToken(ctx context.Context, logicalCluster,
      namespace, name string, ttl time.Duration) (string, error)
  name: impl-kcpstore
  requirements:
  - codeRefs:
    - method:5763969969c0f4e887f1c499a7fccf73
    id: r.add-finalizer
    level: MUST
    text: Resource.AddFinalizer must build the addition patch with statuspatch.FinalizerAdd
      and apply it through PatchJSON.
  - codeRefs:
    - struct:432c046ab7a1ce292d7fa0372790eed7
    - struct:bd87c7e07b92542841411a9474f66987
    id: r.cache-mutex
    level: MUST
    text: PathCache and Store must guard their maps with a mutex, and neither Lookup
      nor ClientFor may hold the lock across the network call.
  - codeRefs:
    - method:c311b4200adb69d996ac127afb62ed56
    - struct:432c046ab7a1ce292d7fa0372790eed7
    id: r.client-per-cluster-gv
    level: MUST
    text: ClientFor must key clients on logicalCluster plus the group-version string,
      return a cached client when one exists, and otherwise build one from a copy
      of the store config with APIPath set to ref.APIPathPrefix + logicalCluster +
      "/apis", or + "/api" when the group is empty.
  - codeRefs:
    - method:22f545280ed249562e9ca742d5a77c44
    id: r.cluster-path-annotation
    level: MUST
    text: Store.ClusterPath must read the logicalclusters/cluster object in core.kcp.io/v1alpha1
      and return its kcp.PathAnnotation value, failing with ErrNoPath when the annotation
      is empty and wrapping read and parse failures with the logical cluster named.
  - codeRefs:
    - method:c00fe3e383047902bea23ff36069e91f
    id: r.config-accessor
    level: MUST
    text: Store.Config must return the store's tuned rest.Config.
  - codeRefs:
    - function:41b4ccba5b43f3162c43c6569fe3adaf
    - struct:be2a24917d7a285dc53d560ba36c744a
    id: r.config-tuning
    level: MUST
    text: New must derive the store config by applying the QPS and Burst limits to
      the supplied RestConfig, or to an empty config when RestConfig is nil, then
      set Host from ref.BaseHost, JSON content type and accept types, and the supplied
      Transport when non-nil.
  - codeRefs:
    - method:e54d2aabb8486cab3ffb3fccd9e528b4
    id: r.create-from-metadata
    level: MUST
    text: Resource.Create must marshal the object, read its namespace from the encoded
      metadata, POST it into that namespace, and on failure include the response body
      detail plus the object name in the wrapped error.
  - codeRefs:
    - function:d7d93064d1945db238404c68788f971f
    - method:0adeb1384568f6dec86b61baf285da43
    id: r.delete-background
    level: MUST
    text: Resource.Delete must delete with propagationPolicy Background and treat
      an already-absent object as success, returning nil for IsNotFound errors.
  - codeRefs:
    - file:impl/kcpstore/kcpstore.go
    id: r.error-wrapping-prefix
    level: SHOULD
    text: Errors leaving the package should carry the "kcpstore:" prefix and name
      the resource, object, and logical cluster involved so callers can attribute
      a failure without re-reading the request.
  - codeRefs:
    - method:cfd282c2aae4ed3dd3a523783c18bc20
    id: r.finalizers-read
    level: MUST
    text: Resource.Finalizers must read the raw object and return the finalizers parsed
      by statuspatch.FinalizersOf.
  - codeRefs:
    - function:96752734b0a49c97d1a14ee1329189da
    - struct:dafdd052ffecc9d0a327766098dc06f3
    id: r.generic-resource
    level: MUST
    text: Of must return a Resource[T] bound to a Store and a GroupVersionResource,
      and every Resource method must route through the client for the target's logical
      cluster.
  - codeRefs:
    - method:28c264fe91c941c628570295cc91bcea
    id: r.get-decode
    level: MUST
    text: 'Resource.Get must fetch the raw object and unmarshal it into a T, failing
      with "kcpstore: decode object: <err>" when the body does not parse.'
  - codeRefs:
    - method:6647c7478f971106b8507d72f97f9d9a
    id: r.get-raw
    level: MUST
    text: 'Resource.GetRaw must GET the named resource in the target namespace and
      logical cluster and return the raw bytes, wrapping a failure as "kcpstore: read
      <resource> <name> in <cluster>: <err>".'
  - codeRefs:
    - function:41b4ccba5b43f3162c43c6569fe3adaf
    id: r.host-required
    level: MUST
    text: 'New must reject an Options whose Host is empty with the error "kcpstore:
      Host is required".'
  - codeRefs:
    - method:708cca7ea762c4eac4f03c27a2e78121
    id: r.list-cluster
    level: MUST
    text: 'Resource.List must GET the resource across the logical cluster and decode
      the items array, wrapping failure as "kcpstore: list <resource> in <cluster>:
      <err>".'
  - codeRefs:
    - method:08d58c09d0e2e942a57a5d0cd38b26bf
    id: r.list-namespace
    level: MUST
    text: 'Resource.ListIn must GET the resource in one namespace of a logical cluster
      and decode the items array, wrapping failure as "kcpstore: list <resource> in
      <cluster>/<namespace>: <err>".'
  - codeRefs:
    - file:impl/kcpstore/kcpstore_test.go
    - file:impl/kcpstore/live_test.go
    id: r.live-tests
    level: MAY
    text: The package may be exercised against a real kcp instance through the live
      tests alongside the unit tests.
  - codeRefs:
    - method:2da1765147db771d09748666fa261d52
    id: r.mint-token
    level: MUST
    text: Store.MintServiceAccountToken must default an empty namespace to "default",
      POST a TokenRequest with the TTL converted to seconds at the serviceaccounts/<name>/token
      subresource in the core v1 group, and fail when the response carries no token.
  - codeRefs:
    - method:c256b1a18aecee599f7d008d7300042e
    id: r.patch-json
    level: MUST
    text: 'Resource.PatchJSON must apply the patch as a JSON patch to the named resource,
      failing with "kcpstore: patch <resource> <name> in <cluster>: <err><detail>".'
  - codeRefs:
    - method:060eafce6e59dd5e79f3672d53ae6d3b
    id: r.patch-status-merge
    level: MUST
    text: Resource.PatchStatus must apply the patch at the status subresource as a
      merge patch after statuspatch.WithResourceVersion stamps the target's resource
      version, and must fail with the response detail on error.
  - codeRefs:
    - file:impl/kcpstore/paths.go
    - method:67159703f7d37d59b1fec3d3fe2613b0
    id: r.path-cache-definitive-only
    level: MUST
    text: 'PathCache.Lookup must store only what ClusterPath answers definitively:
      success, ErrNoPath, or an IsNotFound error. Every other error must return the
      empty string without writing an entry, so it is asked again.'
  - codeRefs:
    - method:2124e46883b2f5ba56788dc76b299726
    - method:f26fdfbd10d0713dc8243504308be1dc
    id: r.path-cache-forget
    level: MUST
    text: PathCache.Forget must drop the entry for a logical cluster so the next Lookup
      resolves it again, and PathCache.Len must report the number of cached entries;
      both must be safe under the cache mutex.
  - codeRefs:
    - method:67159703f7d37d59b1fec3d3fe2613b0
    - struct:bd87c7e07b92542841411a9474f66987
    id: r.path-cache-hit-skips-store
    level: MUST
    text: PathCache.Lookup must return a cached path without calling the store when
      the logical cluster is already present, and must tolerate a nil store by caching
      the empty string.
  - codeRefs:
    - file:impl/kcpstore/paths.go
    - method:67159703f7d37d59b1fec3d3fe2613b0
    id: r.path-cache-retry-healing-errors
    level: MUST
    text: A refusal, an outage, an unparseable body, and a cancelled call must all
      be treated as non-definitive, because a token mid-refresh and a grant not yet
      visible are refusals that heal; the allowlist form means an unanticipated error
      is retried rather than frozen into a workspace's name.
  - codeRefs:
    - method:b56020606bf6fc9651ef87cd37dbe904
    - method:b590040c169d2610823c037f9e6acc73
    id: r.remove-finalizer-absent-ok
    level: MUST
    text: Resource.RemoveFinalizer must read the current finalizers and remove one,
      treating an object that is no longer there as success, and it must delegate
      the patch to RemoveKnownFinalizer.
  - codeRefs:
    - method:b56020606bf6fc9651ef87cd37dbe904
    id: r.remove-known-finalizer-noop
    level: MUST
    text: Resource.RemoveKnownFinalizer must build the removal patch from the supplied
      current list and skip the request entirely when statuspatch.FinalizerRemove
      returns a nil patch.
  upstream: self
- code:
  - impl/memoryrunner/memoryrunner.go
  - impl/memoryrunner/memoryrunner_test.go
  id: sc.impl-memoryrunner
  intent: 'This context exists to give the rest of kcp-libs a controllable, in-memory
    fake for the runner contracts (abc/runner), so controllers, reconcile loops and
    tests can drive pod and engine lifecycles through Start/Observe/Stop/Probe without
    spawning real processes. It carries the observed tests, which pin the observable
    behavior: a pod runs for PollsBeforeDone polls before reporting the configured
    outcome, Stop on a running pod yields StateFailed "stopped", an unknown pod run
    is an error, and an engine exits after ExitsAfterPolls polls or when stopped with
    message "stopped". It is deliberately minimal and lives in its own package so
    the generic layers stay free of any workload-runtime assumption.'
  interfaces:
  - file: impl/memoryrunner/memoryrunner.go
    kind: struct
    name: Engine
    signature: type Engine struct { opts EngineOptions; mu sync.Mutex; runs map[string]*engineRun;
      seq atomic.Int64 }
  - file: impl/memoryrunner/memoryrunner.go
    kind: method
    name: Engine.Observe
    signature: func (e *Engine) Observe(_ context.Context, runID string) (runner.EngineStatus,
      error)
  - file: impl/memoryrunner/memoryrunner.go
    kind: method
    name: Engine.Probe
    signature: func (e *Engine) Probe(_ context.Context, _ string, _ []string, _ time.Duration)
      (bool, error)
  - file: impl/memoryrunner/memoryrunner.go
    kind: method
    name: Engine.Start
    signature: func (e *Engine) Start(_ context.Context, _ runner.EngineRequest) (string,
      error)
  - file: impl/memoryrunner/memoryrunner.go
    kind: method
    name: Engine.Stop
    signature: func (e *Engine) Stop(_ context.Context, runID string) error
  - file: impl/memoryrunner/memoryrunner.go
    kind: struct
    name: EngineOptions
    signature: type EngineOptions struct { ExitsAfterPolls int }
  - file: impl/memoryrunner/memoryrunner.go
    kind: function
    name: NewEngine
    signature: func NewEngine(opts EngineOptions) *Engine
  - file: impl/memoryrunner/memoryrunner.go
    kind: function
    name: NewPod
    signature: func NewPod(opts PodOptions) *Pod
  - file: impl/memoryrunner/memoryrunner.go
    kind: struct
    name: Pod
    signature: type Pod struct { opts PodOptions; mu sync.Mutex; runs map[string]*podRun;
      seq atomic.Int64 }
  - file: impl/memoryrunner/memoryrunner.go
    kind: method
    name: Pod.Observe
    signature: func (p *Pod) Observe(_ context.Context, runID string) (runner.PodStatus,
      error)
  - file: impl/memoryrunner/memoryrunner.go
    kind: method
    name: Pod.Probe
    signature: func (p *Pod) Probe(_ context.Context, _ string, _ []string, _ time.Duration)
      (bool, error)
  - file: impl/memoryrunner/memoryrunner.go
    kind: method
    name: Pod.Start
    signature: func (p *Pod) Start(_ context.Context, req runner.PodRequest) (string,
      error)
  - file: impl/memoryrunner/memoryrunner.go
    kind: method
    name: Pod.Stop
    signature: func (p *Pod) Stop(_ context.Context, runID string) error
  - file: impl/memoryrunner/memoryrunner.go
    kind: struct
    name: PodOptions
    signature: type PodOptions struct { Outcome runner.PodStatus; PollsBeforeDone
      int; ProbeResult bool }
  name: impl-memoryrunner
  requirements:
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - function:e2306bd41881382147eaf8b3069895ee
    id: r.engine-construction
    level: MUST
    text: NewEngine must initialise the run map and store the given EngineOptions
      without applying defaults.
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner_test.go
    - method:098390ace6e69e0022deef1529cb656b
    - struct:ee18afe6dcdfa47419c426a3dd83071d
    id: r.engine-exits-after-polls
    level: MUST
    text: 'Engine.Observe must increment the run''s poll counter and, when EngineOptions.ExitsAfterPolls
      is greater than zero and the run is StateRunning with polls greater than or
      equal to it, replace the status with runner.EngineStatus{State: runner.StateFailed,
      Message: "exited"}.'
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - method:098390ace6e69e0022deef1529cb656b
    id: r.engine-observe-unknown-run-errors
    level: MUST
    text: 'Engine.Observe must return an error when the run id is unknown, formatted
      as "memoryrunner: unknown engine run %s".'
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - method:49f3a507847759e15ebe12029f4d7ab6
    id: r.engine-probe-always-true
    level: MUST
    text: Engine.Probe must ignore its arguments and return true with a nil error.
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - struct:9d329f0ad839a867f04ada3209850157
    id: r.engine-satisfies-enginerunner
    level: MUST
    text: Engine must satisfy runner.EngineRunner, asserted at compile time with var
      _ runner.EngineRunner = (*Engine)(nil).
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - method:48226f7f64a37307caf8965bccf68855
    id: r.engine-start-running
    level: MUST
    text: Engine.Start must allocate an id formatted as mengine-<n> from an atomic
      sequence and record the run in StateRunning, returning the id and a nil error.
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner_test.go
    - method:ee1b796b776a0010bd5381e7774de163
    id: r.engine-stop-marks-failure
    level: MUST
    text: 'Engine.Stop must set a known, still-running run to runner.EngineStatus{State:
      runner.StateFailed, Message: "stopped"} and return nil in every case.'
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    id: r.no-runtime-dependency
    level: SHOULD
    text: The package should stay free of process spawning, filesystem or network
      effects and depend only on abc/runner, so it remains a deterministic stand-in
      for real runners.
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner_test.go
    - method:d13dc67d5b49f32d887748200e8e6880
    id: r.pod-observe-transitions-on-polls
    level: MUST
    text: Pod.Observe must increment the run's poll counter and, while the run is
      StateRunning and polls are greater than or equal to PodOptions.PollsBeforeDone,
      replace the status with PodOptions.Outcome; earlier observes report StateRunning.
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - method:d13dc67d5b49f32d887748200e8e6880
    id: r.pod-observe-unknown-run-errors
    level: MUST
    text: 'Pod.Observe must return an error when the run id is unknown, formatted
      as "memoryrunner: unknown pod run %s".'
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - function:e28103a134b3e9ac6daaf0bb72e41005
    - struct:ac6c667397cefb3293ada1d745b0df58
    id: r.pod-option-defaults
    level: MUST
    text: 'NewPod must default Outcome to runner.PodStatus{State: runner.StateSucceeded}
      when Outcome.State is empty, and default PollsBeforeDone to 1 when it is zero.'
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - method:7a9767b282a97214edbe56a9c367cbf9
    id: r.pod-probe-returns-configured-result
    level: MUST
    text: Pod.Probe must ignore its arguments and return PodOptions.ProbeResult with
      a nil error.
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - struct:f1cb1d1b9762a5263f685d1b1a57baa4
    id: r.pod-satisfies-podrunner
    level: MUST
    text: Pod must satisfy runner.PodRunner, asserted at compile time with var _ runner.PodRunner
      = (*Pod)(nil).
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - method:806b7d8c875ce7fdb1779fc6b3eb84f8
    id: r.pod-start-running
    level: MUST
    text: Pod.Start must allocate an id formatted as mempod-<n> from an atomic sequence
      and record the run in StateRunning, returning the id and a nil error.
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner_test.go
    - method:e9fd6d2481d5bc0aad2f394f8ba186eb
    id: r.pod-stop-marks-failure
    level: MUST
    text: 'Pod.Stop must set a still-running run to runner.PodStatus{State: runner.StateFailed,
      Message: "stopped"}, must return nil for an unknown run id, and must return
      nil always.'
  - codeRefs:
    - file:impl/memoryrunner/memoryrunner.go
    - struct:9d329f0ad839a867f04ada3209850157
    - struct:f1cb1d1b9762a5263f685d1b1a57baa4
    id: r.runs-guarded-by-mutex
    level: MUST
    text: Both Pod and Engine must guard their run maps with their own sync.Mutex,
      locking in Start, Observe and Stop so the fakes are safe for concurrent use.
  upstream: self
