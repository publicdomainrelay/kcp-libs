- code:
  - abc/runref/runref.go
  - abc/runref/runref_test.go
  id: sc.abc-runref
  intent: 'This context exists so a reconciler can tell a fresh start from a duplicate
    of a run that is already in flight. Records live only for the configured TTL,
    so the index is a cache of recent starts rather than durable state, and callers
    are expected to refresh a record on each pass (Keep) and drop it when the run
    reaches a terminal phase. AlreadyStarted encodes the refusal rule the admission
    path needs, including the cases that must NOT be refused: no record, the same
    runID, a run that already started, a retry, or a recreated object that carries
    a different UID behind the same name.'
  interfaces:
  - file: abc/runref/runref.go
    kind: function
    name: AlreadyStarted
    signature: func AlreadyStarted(known Record, found bool, current Current) bool
  - file: abc/runref/runref.go
    kind: struct
    name: Current
    signature: type Current struct { RunID string; UID string; Started bool; Retries
      int32 }
  - file: abc/runref/runref.go
    kind: struct
    name: Index
    signature: type Index struct { entries *expiringmap.Map[string, Record] }
  - file: abc/runref/runref.go
    kind: method
    name: Index.Forget
    signature: func (i *Index) Forget(r ref.Ref)
  - file: abc/runref/runref.go
    kind: method
    name: Index.Keep
    signature: func (i *Index) Keep(r ref.Ref, runID, uid string, terminal bool, now
      time.Time)
  - file: abc/runref/runref.go
    kind: method
    name: Index.Len
    signature: func (i *Index) Len() int
  - file: abc/runref/runref.go
    kind: method
    name: Index.Lookup
    signature: func (i *Index) Lookup(r ref.Ref) (Record, bool)
  - file: abc/runref/runref.go
    kind: method
    name: Index.Record
    signature: func (i *Index) Record(r ref.Ref, runID, uid string, now time.Time)
  - file: abc/runref/runref.go
    kind: function
    name: New
    signature: func New(ttl time.Duration) *Index
  - file: abc/runref/runref.go
    kind: struct
    name: Record
    signature: type Record struct { Ref ref.Ref; RunID string; UID string; At time.Time
      }
  name: abc-runref
  requirements:
  - codeRefs:
    - file:abc/runref/runref.go
    - function:b3be3bdb00e0f276639e92a391046532
    id: r.already-started-no-record-no-refusal
    level: MUST
    text: AlreadyStarted returns false when found is false, when known.RunID is empty,
      or when known.RunID equals current.RunID.
  - codeRefs:
    - file:abc/runref/runref.go
    - file:abc/runref/runref_test.go
    - function:b3be3bdb00e0f276639e92a391046532
    id: r.already-started-refuses-stale-pending-copy
    level: MUST
    text: AlreadyStarted returns true only for a found record with a different non-empty
      runID against a current run that has not started, has no retries, and has no
      conflicting UID; this is the refusal of a stale Pending copy.
  - codeRefs:
    - file:abc/runref/runref.go
    - function:b3be3bdb00e0f276639e92a391046532
    id: r.already-started-retry-not-duplicate
    level: MUST
    text: AlreadyStarted returns false when current.Started is true or current.Retries
      > 0, so a run that has started before is retrying, not duplicating.
  - codeRefs:
    - file:abc/runref/runref.go
    - function:b3be3bdb00e0f276639e92a391046532
    id: r.already-started-uid-mismatch-not-duplicate
    level: MUST
    text: AlreadyStarted returns false when both known.UID and current.UID are non-empty
      and differ, so a recreated object behind the same name is not refused.
  - codeRefs:
    - file:abc/runref/runref.go
    - method:cae442026fb66407a9804c8987ffee8e
    id: r.forget-deletes-by-normalized-ref
    level: MUST
    text: Index.Forget deletes every entry whose Ref equals ref.New(r.LogicalCluster,
      r.Namespace, r.Name), regardless of runID.
  - codeRefs:
    - file:abc/runref/runref.go
    - method:f29af6e54699815a89e6dfded48853b8
    id: r.keep-terminal-or-empty-runid-forgets
    level: MUST
    text: Index.Keep calls Forget when terminal is true or runID is empty, and Record
      otherwise, so terminal runs leave no trace in the index.
  - codeRefs:
    - file:abc/runref/runref.go
    - method:f61f5a9ef40992f65bfc79298b0fc1b8
    id: r.len-reports-entry-count
    level: MUST
    text: Index.Len returns the number of live entries held by the underlying map.
  - codeRefs:
    - file:abc/runref/runref.go
    - method:a092ed399600f5b0fda4c653bab06826
    id: r.lookup-returns-first-matching-ref
    level: MUST
    text: Index.Lookup returns the first entry whose Ref equals the normalized key
      and true, or the zero Record and false when no entry matches.
  - codeRefs:
    - file:abc/runref/runref.go
    - function:02b977ff8ed4f89bd7fb19f709f855a0
    id: r.new-builds-index-with-ttl
    level: MUST
    text: New(ttl) returns an Index backed by an expiring map with that TTL, so records
      age out without an explicit delete.
  - codeRefs:
    - file:abc/runref/runref.go
    - method:31e9e3f14991919b8dc8c86a1ae20707
    id: r.record-ignores-empty-runid
    level: MUST
    text: Index.Record with an empty runID is a no-op; nothing is stored.
  - codeRefs:
    - file:abc/runref/runref.go
    - method:31e9e3f14991919b8dc8c86a1ae20707
    - struct:f9c19c773fc6457d35bf1a48e8d0750c
    id: r.record-normalizes-ref-key
    level: MUST
    text: Index.Record stores the entry under the runID, with Ref rebuilt from ref.New(r.LogicalCluster,
      r.Namespace, r.Name), so the map key and the stored Ref are the normalized triple.
  - codeRefs:
    - file:abc/runref/runref.go
    - method:31e9e3f14991919b8dc8c86a1ae20707
    id: r.record-prunes-other-run-for-same-ref
    level: MUST
    text: Index.Record prunes any stored entry whose id differs from the new runID
      and whose Ref equals the new normalized key, so one ref keeps only the newest
      run.
  upstream: self
- code:
  - abc/store/store.go
  - abc/store/store_test.go
  id: sc.abc-store
  intent: This context exists to fix the storage contract that the rest of kcp-libs
    codes against. Controllers, caches and reconcilers need to read and write cluster
    objects and mint service account tokens, but they must not depend on a concrete
    Kubernetes client or on a specific workload runtime. abc-store supplies that seam
    as small generic interfaces plus one pure comparison helper. Unchanged exists
    because status patches should only be sent when the object actually changed on
    the wire, and that comparison must follow JSON encoding rules rather than Go struct
    identity.
  interfaces:
  - file: abc/store/store.go
    kind: interface
    name: Reader
    signature: type Reader[T any] interface { Get(ctx context.Context, r ref.Ref)
      (*T, error); List(ctx context.Context, logicalCluster string) ([]T, error) }
  - file: abc/store/store.go
    kind: method
    name: Reader.Get
    signature: Get(ctx context.Context, r ref.Ref) (*T, error)
  - file: abc/store/store.go
    kind: method
    name: Reader.List
    signature: List(ctx context.Context, logicalCluster string) ([]T, error)
  - file: abc/store/store.go
    kind: interface
    name: Resource
    signature: type Resource interface{}
  - file: abc/store/store.go
    kind: interface
    name: TokenMinter
    signature: type TokenMinter interface { MintServiceAccountToken(ctx context.Context,
      logicalCluster, namespace, name string, ttl time.Duration) (string, error) }
  - file: abc/store/store.go
    kind: method
    name: TokenMinter.MintServiceAccountToken
    signature: MintServiceAccountToken(ctx context.Context, logicalCluster, namespace,
      name string, ttl time.Duration) (string, error)
  - file: abc/store/store.go
    kind: function
    name: Unchanged
    signature: func Unchanged(a, b any) bool
  - file: abc/store/store.go
    kind: interface
    name: Writer
    signature: type Writer[T any] interface { Create(ctx context.Context, logicalCluster
      string, obj *T) error; Delete(ctx context.Context, r ref.Ref) error; PatchStatus(ctx
      context.Context, r ref.Ref, patch []byte) error; RemoveFinalizer(ctx context.Context,
      r ref.Ref, finalizer string) error }
  - file: abc/store/store.go
    kind: method
    name: Writer.Create
    signature: Create(ctx context.Context, logicalCluster string, obj *T) error
  - file: abc/store/store.go
    kind: method
    name: Writer.Delete
    signature: Delete(ctx context.Context, r ref.Ref) error
  - file: abc/store/store.go
    kind: method
    name: Writer.PatchStatus
    signature: PatchStatus(ctx context.Context, r ref.Ref, patch []byte) error
  - file: abc/store/store.go
    kind: method
    name: Writer.RemoveFinalizer
    signature: RemoveFinalizer(ctx context.Context, r ref.Ref, finalizer string) error
  name: abc-store
  requirements:
  - codeRefs:
    - file:abc/store/store.go
    - interface:24a75b1e85b321842f9208ef68c555dd
    - interface:35f2d3c152cb806dafbc20869a2b1645
    id: r.generic-reader-writer-pair
    level: SHOULD
    text: Reader and Writer should stay generic over T so a single pair of interfaces
      serves every stored object type, and should name no concrete API server or workload
      runtime.
  - codeRefs:
    - interface:35f2d3c152cb806dafbc20869a2b1645
    - method:dd7423535cde997b6ddc93c5ec334c4b
    - method:e52cadf103fd9081db57993476b63580
    id: r.reader-get-and-list
    level: MUST
    text: Reader must expose Get, which takes a context and a ref.Ref and returns
      a pointer to T, and List, which takes a context and a logicalCluster string
      and returns a slice of T.
  - codeRefs:
    - file:abc/store/store.go
    - interface:9d5d8b965e6b6d107bc98f738bd212ac
    id: r.resource-marker
    level: MUST
    text: Resource must be a generic interface that marks a type as storable by the
      Reader and Writer implementations.
  - codeRefs:
    - interface:60623c60df0bde883df69e0a6fd8778d
    - method:1d478157f0c21fec12ff68cca5afa4d8
    id: r.token-minter
    level: MUST
    text: TokenMinter must expose MintServiceAccountToken, which takes a context,
      logicalCluster, namespace, name and ttl, and returns the minted token string
      or an error.
  - codeRefs:
    - file:abc/store/store.go
    - file:abc/store/store_test.go
    - function:989c182ec2114a55ce5c64d494875860
    id: r.unchanged-compares-wire-shape
    level: MUST
    text: Unchanged must marshal both arguments with encoding/json and report equality
      by comparing the encoded bytes, so that two values with equal wire shape are
      equal regardless of Go struct identity or map key order.
  - codeRefs:
    - file:abc/store/store_test.go
    - function:989c182ec2114a55ce5c64d494875860
    id: r.unchanged-fails-closed-on-encode-error
    level: MUST
    text: Unchanged must return false when either argument fails to marshal to JSON,
      so an unencodable value is never reported as unchanged.
  - codeRefs:
    - interface:24a75b1e85b321842f9208ef68c555dd
    - method:0c58430aa89b1920a3744d460c85b616
    - method:b66a329085f8ae0870f5487662772dd4
    - method:cf43c7d659eb7321032b9dd58fe618c7
    - method:fbb58fe6aca56610baea0a33ce6e3d5f
    id: r.writer-mutations
    level: MUST
    text: Writer must expose Create taking a context, logicalCluster and object pointer;
      Delete taking a context and ref.Ref; PatchStatus taking a context, ref.Ref and
      a raw patch byte slice; and RemoveFinalizer taking a context, ref.Ref and the
      finalizer name. Each returns an error.
  upstream: self
- code:
  - common/clientlimit/clientlimit.go
  - common/clientlimit/clientlimit_test.go
  id: sc.common-clientlimit
  intent: 'This context exists because client-go defaults every client to 5 qps with
    a burst of 10, which starves a controller that watches and reconciles many objects.
    The package centralises the fix in one function so each controller construction
    path (exportwatch, informerwatch, kcpstore) applies the same rate-limit policy
    without duplicating the defaulting logic, and keeps caller intent: an operator
    who explicitly sets QPS or Burst on a config is not overridden. It sits in the
    generic common layer, names no workload runtime, and is usable by any component
    that builds a rest.Config.'
  interfaces:
  - file: common/clientlimit/clientlimit.go
    kind: function
    name: Apply
    signature: func Apply(cfg *rest.Config, qps float32, burst int) *rest.Config
  name: common-clientlimit
  requirements:
  - codeRefs:
    - file:common/clientlimit/clientlimit.go
    - function:67bc041de773d39e4803a9795f096d96
    id: r.caller-value-wins
    level: MUST
    text: Apply must set out.QPS only when the copied config's QPS is <= 0 and out.Burst
      only when its Burst is <= 0, so a rate limit the caller already set on the config
      is kept.
  - codeRefs:
    - file:common/clientlimit/clientlimit_test.go
    id: r.default-above-client-go-default
    level: MUST
    text: DefaultQPS must stay greater than 5, because client-go defaults every client
      to 5 qps with a burst of 10, which starves a controller.
  - codeRefs:
    - file:common/clientlimit/clientlimit_test.go
    - function:67bc041de773d39e4803a9795f096d96
    id: r.explicit-option-overrides-empty-config
    level: MUST
    text: When the config carries no rate limit, a positive qps and burst argument
      must be used as the resulting QPS and Burst.
  - codeRefs:
    - file:common/clientlimit/clientlimit.go
    id: r.generic-layer-no-runtime
    level: SHOULD
    text: 'The package must stay generic: it names no workload runtime and works from
      a plain *rest.Config, so any controller construction path can use it.'
  - codeRefs:
    - file:common/clientlimit/clientlimit.go
    - function:67bc041de773d39e4803a9795f096d96
    id: r.non-positive-option-falls-back-to-default
    level: MUST
    text: A qps less than or equal to zero must fall back to DefaultQPS, and a burst
      less than or equal to zero must fall back to DefaultBurst.
  - codeRefs:
    - file:common/clientlimit/clientlimit.go
    - function:67bc041de773d39e4803a9795f096d96
    id: r.returns-copy-not-mutation
    level: MUST
    text: Apply must copy the given config with rest.CopyConfig and return the copy;
      the config passed by the caller must not be mutated.
  upstream: self
