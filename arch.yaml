  - common/condition/condition_test.go
  id: sc.common-condition
  intent: 'This context exists to specify the shared condition helpers that kcp-libs
    controllers use when reporting status. Rather than each controller reimplementing
    condition bookkeeping, common/condition centralises it: a single Set entry point
    that records type, status, reason, message and observed generation through meta.SetStatusCondition,
    thin SetTrue/SetFalse wrappers over that entry point, and the small reader/eraser
    functions Of, Is, Remove and Copy that callers need around it. It exists so condition
    handling is uniform, so the observed generation is never forgotten, and so callers
    can hand out copies of a condition list without aliasing the live one.'
  interfaces:
  - file: common/condition/condition.go
    kind: function
    name: Copy
    signature: func Copy(in []metav1.Condition) []metav1.Condition
  - file: common/condition/condition.go
    kind: function
    name: Is
    signature: func Is(list []metav1.Condition, kind string, status metav1.ConditionStatus)
      bool
  - file: common/condition/condition.go
    kind: function
    name: Of
    signature: func Of(list []metav1.Condition, kind string) *metav1.Condition
  - file: common/condition/condition.go
    kind: function
    name: Remove
    signature: func Remove(list *[]metav1.Condition, kind string)
  - file: common/condition/condition.go
    kind: function
    name: Set
    signature: func Set(list *[]metav1.Condition, generation int64, status metav1.ConditionStatus,
      kind, reason, message string)
  - file: common/condition/condition.go
    kind: function
    name: SetFalse
    signature: func SetFalse(list *[]metav1.Condition, generation int64, kind, reason,
      message string)
  - file: common/condition/condition.go
    kind: function
    name: SetTrue
    signature: func SetTrue(list *[]metav1.Condition, generation int64, kind, reason,
      message string)
  name: common-condition
  requirements:
  - codeRefs:
    - file:common/condition/condition.go
    - function:741af730ad7d212947f2d9d42bf55557
    id: r.copy-independent-clone
    level: MUST
    text: Copy must return an independent clone of the input condition slice, so that
      mutating the returned slice does not change the input.
  - codeRefs:
    - file:common/condition/condition.go
    - function:e1d40351c0eded29676ce645d7c908ab
    id: r.is-status-test
    level: MUST
    text: Is must report whether the condition of the given kind exists in the list
      and carries the given status.
  - codeRefs:
    - file:common/condition/condition.go
    - function:d9d1ab909c15980c4699a3cb56bea924
    - function:ead30502c3fe49e900a144e9e71219a5
    id: r.mutations-through-pointer
    level: SHOULD
    text: The mutating helpers Set, SetTrue, SetFalse and Remove should take a pointer
      to the condition slice and update the caller's list in place rather than returning
      a new list.
  - codeRefs:
    - file:common/condition/condition_test.go
    - function:d9d1ab909c15980c4699a3cb56bea924
    id: r.observed-generation-recorded
    level: MUST
    text: Set must record the supplied generation as the condition's ObservedGeneration,
      so a condition written at generation 3 reports ObservedGeneration 3.
  - codeRefs:
    - file:common/condition/condition.go
    - function:2f22991378805fd945c1a0d94b1e9b0e
    id: r.of-lookup-or-nil
    level: MUST
    text: Of must return a pointer to the condition of the given kind in the list,
      and nil when no condition of that kind is present.
  - codeRefs:
    - file:common/condition/condition.go
    - function:ead30502c3fe49e900a144e9e71219a5
    id: r.remove-by-kind
    level: MUST
    text: Remove must delete the condition of the given kind from the list, after
      which Of for that kind returns nil.
  - codeRefs:
    - file:common/condition/condition.go
    - function:d9d1ab909c15980c4699a3cb56bea924
    id: r.set-delegates-to-metav1
    level: MUST
    text: Set must write a metav1.Condition carrying the given type, status, reason,
      message and observed generation, by delegating to meta.SetStatusCondition on
      the caller's list pointer.
  - codeRefs:
    - file:common/condition/condition.go
    - function:eee1a190d5df1941cf6cb5d346a99684
    id: r.set-false-shorthand
    level: MUST
    text: SetFalse must set the condition with status metav1.ConditionFalse, forwarding
      the generation, kind, reason and message to Set.
  - codeRefs:
    - file:common/condition/condition_test.go
    - function:d9d1ab909c15980c4699a3cb56bea924
    id: r.set-replaces-same-type
    level: MUST
    text: A set must replace the previous condition of the same type, so the list
      holds at most one condition per type and its length does not grow on repeated
      sets.
  - codeRefs:
    - file:common/condition/condition.go
    - function:a5845019d1d1a5d547885188f6cf2d6a
    id: r.set-true-shorthand
    level: MUST
    text: SetTrue must set the condition with status metav1.ConditionTrue, forwarding
      the generation, kind, reason and message to Set.
  - codeRefs:
    - file:common/condition/condition.go
    - file:common/condition/condition_test.go
    id: r.unchanged-condition-keeps-transition-time
    level: MUST
    text: Setting a condition whose type, status, reason and message are unchanged
      must preserve the existing transition time rather than resetting it.
  upstream: self
- code:
  - common/denocomputer/denocomputer.go
  - common/denocomputer/denocomputer_test.go
  id: sc.common-denocomputer
  intent: This context exists to keep one copy of the deno.computer names and phases
    that both this generic library and the deno-kcp consumer agree on. Rather than
    letting the library invent its own group, finalizers, labels, conditions or phase
    strings, the constants live here and a test reads the consumer's own source as
    the source of truth and fails on any drift. The phase predicates sit beside the
    Phase type so callers in the reconcile paths can ask whether a run, pod, job,
    policy workflow or policy engine has finished without re-encoding which phases
    count as terminal in every call site.
  interfaces:
  - file: common/denocomputer/denocomputer.go
    kind: type_alias
    name: Phase
    signature: type Phase string
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: RunningPhase
    signature: func RunningPhase(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalDenoJob
    signature: func TerminalDenoJob(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalDenoPod
    signature: func TerminalDenoPod(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalDenoRun
    signature: func TerminalDenoRun(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalPolicyEngine
    signature: func TerminalPolicyEngine(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalPolicyWorkflow
    signature: func TerminalPolicyWorkflow(phase string) bool
  name: common-denocomputer
  requirements:
  - codeRefs:
    - file:common/denocomputer/denocomputer.go
    - file:common/denocomputer/denocomputer_test.go
    id: r.consumer-checkout-optional
    level: SHOULD
    text: The consumer-agreement tests should skip when the deno-kcp checkout is not
      next to this module, and should fail instead of skipping when KCP_LIBS_REQUIRE_CONSUMER
      is 1.
  - codeRefs:
    - file:common/denocomputer/denocomputer_test.go
    id: r.finalizers-match-consumer
    level: MUST
    text: Every finalizer string this module declares (FinalizerDenoRun, FinalizerDenoPod,
      FinalizerPolicyEngine, FinalizerPolicyWorkflowRun, FinalizerOpenBao) must be
      one the consumer declares; none may be invented.
  - codeRefs:
    - file:common/denocomputer/denocomputer_test.go
    id: r.group-and-version-match-consumer
    level: MUST
    text: Group, Version and the derived APIVersion must equal the GroupName and Version
      the deno-kcp consumer declares in its api/v1alpha1 package.
  - codeRefs:
    - file:common/denocomputer/denocomputer_test.go
    id: r.labels-match-consumer
    level: MUST
    text: PolicyWorkflowPodLabel, JobRunLabel and TriggerLabel must match the consumer's
      declared values; TriggerLabel may instead be accepted when the consumer names
      that exact literal anywhere in its Go source.
  - codeRefs:
    - type_alias:a265ac7a2b0813430059371d42a76985
    id: r.phase-is-string-alias
    level: MUST
    text: Phase is a string type, so phase constants and stored phase strings interchange
      through a plain string conversion.
  - codeRefs:
    - file:common/denocomputer/denocomputer_test.go
    id: r.phases-conditions-reasons-match-consumer
    level: MUST
    text: 'The phase, condition and reason strings this module declares must be the
      ones the consumer stores: DenoRunPending/Running/Succeeded/Failed, PolicyWorkflowCancelled,
      RunTriggerTriggered, the five Condition names, the two OpenBao conditions, and
      the three reason strings ReasonPolicyWorkflowPodMissing, ReasonEngineNotReady
      and ReasonQueued.'
  - codeRefs:
    - function:67ee37b108a01a226ce8f48241d735b8
    id: r.running-phase
    level: MUST
    text: RunningPhase(phase) must hold exactly when the phase is Running, and must
      not hold for a finished phase such as Succeeded.
  - codeRefs:
    - function:36ff8f97f3450e32e33a6b3b0e493610
    id: r.terminal-deno-job
    level: MUST
    text: TerminalDenoJob(phase) must hold for Succeeded and Failed, and must not
      hold for a run in flight such as Running or Pending.
  - codeRefs:
    - function:0d13333d7202e69c40af4472e0f2436b
    id: r.terminal-deno-pod
    level: MUST
    text: TerminalDenoPod(phase) must hold for Succeeded and Failed, and must not
      hold for a run in flight such as Running or Pending.
  - codeRefs:
    - function:6e7c1837ac42c5ecd27e997607373d2d
    id: r.terminal-deno-run
    level: MUST
    text: TerminalDenoRun(phase) must hold for Succeeded and Failed, and must not
      hold for Running or Pending.
  - codeRefs:
    - function:8947f352a45e5a31be8d9bdad53c8a93
    id: r.terminal-policy-engine
    level: MUST
    text: TerminalPolicyEngine(phase) must hold only for Failed; it must not hold
      for Running or for any other phase.
  - codeRefs:
    - function:0ac0b313ea9228a561bfd9f56465b4be
    id: r.terminal-policy-workflow
    level: MUST
    text: TerminalPolicyWorkflow(phase) must hold for Succeeded, Failed and Cancelled,
      so a cancelled policy run counts as terminal, unlike a cancelled plain run or
      pod.
  upstream: self
- code:
  - common/denospec/denospec.go
  - common/denospec/denospec_contract_test.go
  - common/denospec/denospec_test.go
  id: sc.common-denospec
  intent: This context exists so that the deno workload vocabulary lives in one Go
    package that both the KCP libraries and the Deno-side consumer agree on. The structs
    are the wire contract; the contract test fails if the Go shapes drift from what
    the consumer declares. Validate and Args exist so that a permission set declared
    as data becomes a checked, runnable Deno command line rather than an ad-hoc string
    built at each call site, and EffectiveRestartPolicy and ProbeCommand pin down
    the remaining runtime decisions around restarts and probes.
  interfaces:
  - file: common/denospec/denospec.go
    kind: function
    name: Args
    signature: func (p *Permissions) Args() ([]string, error)
  - file: common/denospec/denospec.go
    kind: function
    name: EffectiveRestartPolicy
    signature: func EffectiveRestartPolicy(policy RestartPolicy) RestartPolicy
  - file: common/denospec/denospec.go
    kind: struct
    name: ExecProbe
    signature: type ExecProbe struct
  - file: common/denospec/denospec.go
    kind: struct
    name: Permission
    signature: type Permission struct { Allow bool; AllowList []string; Deny bool;
      DenyList []string }
  - file: common/denospec/denospec.go
    kind: struct
    name: Permissions
    signature: type Permissions struct { All bool; NoPrompt bool; HRTime bool; Read
      *Permission; Write *Permission; Net *Permission; Env *Permission; Run *Permission;
      FFI *Permission; Sys *Permission; Import *Permission; IgnoreEnv *Permission;
      AllowScripts []string }
  - file: common/denospec/denospec.go
    kind: struct
    name: PodTemplate
    signature: type PodTemplate struct
  - file: common/denospec/denospec.go
    kind: function
    name: ProbeCommand
    signature: func ProbeCommand(runtime, shim, probe, name, path string, allowEnv
      []string) []string
  - file: common/denospec/denospec.go
    kind: type_alias
    name: RestartPolicy
    signature: type RestartPolicy
  - file: common/denospec/denospec.go
    kind: struct
    name: ServiceAccountRef
    signature: type ServiceAccountRef struct { Name string; Namespace string }
  - file: common/denospec/denospec.go
    kind: function
    name: Validate
    signature: func (p *Permissions) Validate() error
  name: common-denospec
  requirements:
  - codeRefs:
    - file:common/denospec/denospec_test.go
    - function:8d4402900d3462a266b3860020572db3
    id: r.args-render-permission-flags
    level: MUST
    text: Permissions.Args must render the permission set into a Deno argument list
      covering every flag form, returning an error rather than a partial list when
      the permissions do not validate.
  - codeRefs:
    - file:common/denospec/denospec.go
    - function:8c740b4bfa20b8c5c3abcbedabd84404
    - type_alias:c9ed92b47f68b4cc5b0bb51223210dbb
    id: r.effective-restart-policy-resolves-default
    level: MUST
    text: EffectiveRestartPolicy must resolve an unset or unrecognised RestartPolicy
      to the policy the workload is actually restarted under, so callers need not
      special-case the empty value.
  - codeRefs:
    - file:common/denospec/denospec_contract_test.go
    - struct:e63b3474fb8e8342ee8ddcbf9aeff650
    id: r.exec-probe-shape-matches-consumer
    level: MUST
    text: ExecProbe must carry the exec probe shape the consumer declares, so a probe
      written on either side decodes on the other.
  - codeRefs:
    - file:common/denospec/denospec.go
    id: r.no-workload-runtime-assumption-elsewhere
    level: SHOULD
    text: The deno vocabulary should stay in this package, so the generic library
      layers keep naming no workload runtime and remain usable without deno.
  - codeRefs:
    - file:common/denospec/denospec.go
    - struct:bbb7094c15f71e3d40b7bd6ef4ffad5e
    id: r.permission-allow-and-deny-forms
    level: MUST
    text: Permission must express both the bare allow and deny booleans and their
      AllowList and DenyList member lists, so a permission can be granted or refused
      wholesale or narrowed to named members.
  - codeRefs:
    - file:common/denospec/denospec.go
    - struct:37cfecc71eb8d4169a8fdffff71f2eb3
    id: r.permissions-cover-deno-capabilities
    level: MUST
    text: 'Permissions must cover Deno''s capability set: All, NoPrompt, HRTime, and
      the Read, Write, Net, Env, Run, FFI, Sys, Import and IgnoreEnv permissions,
      plus AllowScripts for the named scripts that may run.'
  - codeRefs:
    - file:common/denospec/denospec.go
    - struct:ee22e42a28e08358a06298c6048e62e5
    id: r.pod-template-describes-workload
    level: MUST
    text: PodTemplate must describe the pod the deno workload runs in, including its
      probe, so a consumer declares the pod in the same shape the Go side decodes.
  - codeRefs:
    - file:common/denospec/denospec.go
    - function:10ed3675a84f3ace014b3a75a3e36f7c
    - struct:e63b3474fb8e8342ee8ddcbf9aeff650
    id: r.probe-command-is-issued-through-the-shim
    level: MUST
    text: ProbeCommand must build the probe invocation from the runtime, shim, probe,
      name and path, passing only the environment names in allowEnv, so a probe runs
      under the same runtime and shim as the workload with a bounded environment.
  - codeRefs:
    - file:common/denospec/denospec.go
    - struct:81393b3c6451cfbfd692bcbb851b30a9
    id: r.service-account-ref-names-identity
    level: MUST
    text: ServiceAccountRef must carry the service account Name and an optional Namespace,
      so a workload can name the identity it runs as without pinning a namespace.
  - codeRefs:
    - file:common/denospec/denospec_contract_test.go
    - struct:37cfecc71eb8d4169a8fdffff71f2eb3
    - struct:81393b3c6451cfbfd692bcbb851b30a9
    - struct:bbb7094c15f71e3d40b7bd6ef4ffad5e
    - struct:e63b3474fb8e8342ee8ddcbf9aeff650
    - struct:ee22e42a28e08358a06298c6048e62e5
    id: r.shapes-match-consumer-declaration
    level: MUST
    text: Every exported shape in this package must carry exactly the field names
      the TypeScript consumer declares for it, so a value written from one side decodes
      as the other; the contract test fails when a shape here is invented or drifts.
  - codeRefs:
    - file:common/denospec/denospec_test.go
    - function:961db49fe00a81882f3e64de7ff7262d
    id: r.validate-rejects-unrepresentable-permissions
    level: MUST
    text: Permissions.Validate must return an error for permission values that cannot
      be rendered as Deno flags, rejecting commas and empty values, and return nil
      for a permission set that can be rendered.
  upstream: self
- code:
  - common/expiringmap/expiringmap.go
  - common/expiringmap/expiringmap_test.go
  id: sc.common-expiringmap
  intent: 'This context exists as the shared expiry primitive for the wider kcp-libs
    project: callers that need a bounded-lifetime cache (for example the job allocator''s
    lookup tables) get one place that owns the TTL comparison, the lazy delete on
    read, and the locking discipline, rather than each site re-deriving `at.Sub(entry.At)
    >= ttl` and remembering to hold a lock while doing it. Passing `at` in rather
    than calling time.Now keeps the expiry behaviour deterministic and testable, which
    is exactly how the accompanying test file drives it.'
  interfaces:
  - file: common/expiringmap/expiringmap.go
    kind: const
    name: DefaultTTL
    signature: const DefaultTTL = 2 * time.Minute
  - file: common/expiringmap/expiringmap.go
    kind: struct
    name: Entry
    signature: type Entry[V any] struct { Value V; At time.Time }
  - file: common/expiringmap/expiringmap.go
    kind: struct
    name: Map
    signature: type Map[K comparable, V any] struct { TTL time.Duration; mu sync.Mutex;
      entries map[K]Entry[V] }
  - file: common/expiringmap/expiringmap.go
    kind: method
    name: Map.Delete
    signature: func (m *Map[K, V]) Delete(key K)
  - file: common/expiringmap/expiringmap.go
    kind: method
    name: Map.DeleteIf
    signature: func (m *Map[K, V]) DeleteIf(drop func(K, V) bool) int
  - file: common/expiringmap/expiringmap.go
    kind: method
    name: Map.Expire
    signature: func (m *Map[K, V]) Expire(at time.Time) int
  - file: common/expiringmap/expiringmap.go
    kind: method
    name: Map.Get
    signature: func (m *Map[K, V]) Get(key K, at time.Time) (V, bool)
  - file: common/expiringmap/expiringmap.go
    kind: method
    name: Map.Len
    signature: func (m *Map[K, V]) Len() int
  - file: common/expiringmap/expiringmap.go
    kind: method
    name: Map.Range
    signature: func (m *Map[K, V]) Range(visit func(K, V) bool)
  - file: common/expiringmap/expiringmap.go
    kind: method
    name: Map.Set
    signature: func (m *Map[K, V]) Set(key K, value V, at time.Time)
  - file: common/expiringmap/expiringmap.go
    kind: method
    name: Map.SetPruning
    signature: func (m *Map[K, V]) SetPruning(key K, value V, at time.Time, prune
      func(K, V) bool)
  - file: common/expiringmap/expiringmap.go
    kind: function
    name: NewMap
    signature: func NewMap[K comparable, V any](ttl time.Duration) *Map[K, V]
  name: common-expiringmap
  requirements:
  - codeRefs:
    - file:common/expiringmap/expiringmap_test.go
    id: r.behaviour-covered-by-tests
    level: SHOULD
    text: The package's tests cover set-then-get, the exact-TTL boundary with the
      expired entry dropped, the default TTL for zero and negative inputs, Delete
      and DeleteIf counts, Expire sweeping only entries past their TTL, and Range
      visiting every entry and leaving the map unchanged when the visitor stops.
  - codeRefs:
    - method:82e839c35aabb06ef821933917ec63f0
    id: r.delete-unconditional
    level: MUST
    text: Delete removes the key regardless of whether the entry is live or expired,
      and does nothing when the key is absent.
  - codeRefs:
    - method:7ec6b2c7bd76f63321cd3c4b190a603f
    id: r.deleteif-predicate-count
    level: MUST
    text: DeleteIf drops every entry whose key and value satisfy the caller's predicate
      and returns the number of entries dropped.
  - codeRefs:
    - file:common/expiringmap/expiringmap.go
    - struct:4591c45a4e14e38ecea0056987c4a802
    id: r.entry-stores-value-and-write-time
    level: MUST
    text: An Entry holds the stored value together with the time it was written, so
      expiry is decided against the write time and not against a value the caller
      supplies later.
  - codeRefs:
    - method:565f61a59f8a37b307e3fa936cd2346d
    id: r.expire-sweeps-past-ttl
    level: MUST
    text: Expire drops every entry that is past its TTL as of the given time and returns
      the number of entries dropped, leaving entries written more recently than the
      TTL untouched.
  - codeRefs:
    - file:common/expiringmap/expiringmap.go
    - struct:0cf196f032937400c5ba73ab5c3d51ff
    id: r.expiry-boundary-inclusive
    level: MUST
    text: An entry is expired when the elapsed time since its write time is greater
      than or equal to the TTL, so an entry read at exactly `write + TTL` is already
      gone.
  - codeRefs:
    - method:b2e22247efe32229253f3fb18c64c607
    id: r.get-drops-expired-and-reports-miss
    level: MUST
    text: Get returns the value and true for a live entry, and returns the zero value
      and false for a missing key or an expired entry; an expired entry found on the
      way is deleted from the map so the read leaves the map smaller.
  - codeRefs:
    - method:17d4b8f64aa42e72ce9ddd19f369e46f
    id: r.len-counts-stored-entries
    level: MUST
    text: Len returns the number of entries currently stored, so it counts entries
      that have passed their TTL but have not yet been read or swept.
  - codeRefs:
    - file:common/expiringmap/expiringmap.go
    - struct:0cf196f032937400c5ba73ab5c3d51ff
    id: r.map-type-parameters-and-ttl-field
    level: MUST
    text: Map is generic over a comparable key and any value, and carries its TTL
      as an exported field alongside an unexported mutex and the entry map.
  - codeRefs:
    - file:common/expiringmap/expiringmap.go
    - struct:0cf196f032937400c5ba73ab5c3d51ff
    id: r.mutex-guards-every-operation
    level: MUST
    text: Every map operation that touches the entry map holds the mutex, so concurrent
      Set, Get, Delete, DeleteIf, Expire, Range, SetPruning and Len calls are safe.
  - codeRefs:
    - file:common/expiringmap/expiringmap.go
    - function:b650d97e85ca58be6eed757f0ef38420
    id: r.newmap-defaults-non-positive-ttl
    level: MUST
    text: NewMap returns a Map with the given TTL, but any TTL that is zero or negative
      falls back to defaultTTL; the returned map always has a non-nil entries map.
  - codeRefs:
    - method:8f9103006c5e1c080fd378e749aabca6
    id: r.range-snapshot-then-visit
    level: MUST
    text: Range copies the live keys and values under the lock, releases the lock,
      then visits the snapshot; a nil-returning visitor stops the walk early, and
      stopping or visiting never mutates the map.
  - codeRefs:
    - method:833590fe505d58158e5ad88ed13ba9cc
    id: r.set-records-write-time
    level: MUST
    text: Set stores the value under the key with the caller-supplied time as the
      entry's write time, overwriting any previous entry for that key.
  - codeRefs:
    - method:7b7c2151e545ad092e0d5272ef61b892
    id: r.setpruning-sweeps-then-stores
    level: MUST
    text: SetPruning drops every entry that is either past its TTL as of the given
      time or accepted by the non-nil prune predicate, then stores the new key and
      value under the same lock, so the pruning and the insert are atomic.
  upstream: self
- code:
  - common/kcp/kcp.go
  - common/kcp/kcp_test.go
  id: sc.common-kcp
  intent: This context exists so the naming rules that map a KCP logical cluster path
    onto DNS labels and fully qualified service names stay specified in one place.
    The rest of the repository, the examples and the service-name factory all depend
    on the exact string shape produced here, so the reversal order, the root-workspace
    and empty-segment skipping, the default namespace fallback and the omission of
    an empty label suffix must hold exactly as the tests assert them.
  interfaces:
  - file: common/kcp/kcp.go
    kind: function
    name: ServiceFQDN
    signature: func ServiceFQDN(name, namespace, logicalCluster, domain string) string
  - file: common/kcp/kcp.go
    kind: function
    name: ServiceLabels
    signature: func ServiceLabels(logicalCluster string) string
  name: common-kcp
  requirements:
  - codeRefs:
    - file:common/kcp/kcp.go
    - function:027166c10dcc0d8f2f48420216ff5951
    id: r.fqdn-default-namespace
    level: MUST
    text: ServiceFQDN MUST substitute "default" when the namespace argument is empty,
      and MUST prefix the namespace to the service name as name + "." + namespace.
  - codeRefs:
    - file:common/kcp/kcp.go
    - function:027166c10dcc0d8f2f48420216ff5951
    id: r.fqdn-empty-labels-omitted
    level: MUST
    text: ServiceFQDN MUST append the ServiceLabels result as a dotted suffix only
      when it is non-empty, so a root-only cluster yields no label segment.
  - codeRefs:
    - file:common/kcp/kcp_test.go
    - function:027166c10dcc0d8f2f48420216ff5951
    id: r.fqdn-known-shapes
    level: MUST
    text: 'ServiceFQDN MUST return the asserted shapes: name "pds" with cluster "root:alice"
      gives "pds.default.alice.svc.kcp.local" under DefaultServiceDomain, and cluster
      "root" gives "pds.default.svc.kcp.local".'
  - codeRefs:
    - file:common/kcp/kcp.go
    - function:027166c10dcc0d8f2f48420216ff5951
    id: r.fqdn-svc-domain-suffix
    level: MUST
    text: ServiceFQDN MUST terminate the host with the ServiceSegment value "svc"
      followed by the domain, producing host + ".svc." + domain.
  - codeRefs:
    - file:common/kcp/kcp.go
    - function:0b14d327c26ec834adfa4a6551d0fc8c
    id: r.labels-root-only-empty
    level: MUST
    text: ServiceLabels MUST return the empty string for a logical cluster that contains
      only the root workspace, for example "root".
  - codeRefs:
    - file:common/kcp/kcp.go
    - function:0b14d327c26ec834adfa4a6551d0fc8c
    id: r.labels-skip-empty-and-root
    level: MUST
    text: ServiceLabels MUST skip parts that are empty and parts equal to RootWorkspace,
      and MUST join the remaining parts with ".".
  - codeRefs:
    - file:common/kcp/kcp.go
    - function:0b14d327c26ec834adfa4a6551d0fc8c
    id: r.labels-split-on-colon
    level: MUST
    text: ServiceLabels MUST split the logical cluster on ":" and walk the resulting
      parts from the last to the first, so the deepest workspace segment appears first
      in the result.
  - codeRefs:
    - file:common/kcp/kcp_test.go
    id: r.tests-cover-helpers
    level: SHOULD
    text: Table-driven tests SHOULD keep covering ServiceLabels and ServiceFQDN, including
      the root-only and empty-namespace cases.
  upstream: self
- code:
  - common/logging/logging.go
  id: sc.common-logging
  intent: 'This context exists so that structured logging has one definition instead
    of every package building its own slog handler. It fixes the decisions that would
    otherwise drift: output format is JSON, the zero Level means Info rather than
    Debug, and the service name is a top-level attribute rather than embedded in messages.
    Discard exists so tests and quiet paths can be handed a real *slog.Logger with
    no output at all, which keeps signatures uniform and avoids nil-logger branches
    in callers.'
  interfaces:
  - file: common/logging/logging.go
    kind: function
    name: Discard
    signature: func Discard() *slog.Logger
  - file: common/logging/logging.go
    kind: function
    name: New
    signature: func New(opts Options) *slog.Logger
  - file: common/logging/logging.go
    kind: struct
    name: Options
    signature: type Options struct { Service string; Writer io.Writer; Level slog.Level
      }
  name: common-logging
  requirements:
  - codeRefs:
    - file:common/logging/logging.go
    - function:7e515b3fbe4a91f9d8b15bdd7d149aca
    id: r.discard-writes-nothing
    level: MUST
    text: Discard must return a *slog.Logger whose handler writes to io.Discard at
      slog.LevelError, so callers get a usable logger that emits no output.
  - codeRefs:
    - file:common/logging/logging.go
    - function:630830e31f658442858bdfe9d070a2bd
    - struct:e5309481f2a5ce717212c88d3d90aa51
    id: r.new-defaults-level-to-info
    level: MUST
    text: New must replace a zero opts.Level with slog.LevelInfo, so an unset level
      means Info and not the zero value of slog.Level.
  - codeRefs:
    - function:630830e31f658442858bdfe9d070a2bd
    - struct:e5309481f2a5ce717212c88d3d90aa51
    id: r.new-tags-records-with-the-service
    level: MUST
    text: New must attach a "service" attribute to the logger only when opts.Service
      is not empty; an empty Service must leave the logger untagged.
  - codeRefs:
    - function:630830e31f658442858bdfe9d070a2bd
    - struct:e5309481f2a5ce717212c88d3d90aa51
    id: r.new-writes-json-to-the-writer
    level: MUST
    text: New must build the logger on a slog.NewJSONHandler over opts.Writer with
      the resolved level, so records are JSON lines on the writer the caller supplied.
  - codeRefs:
    - file:common/logging/logging.go
    - function:630830e31f658442858bdfe9d070a2bd
    - struct:e5309481f2a5ce717212c88d3d90aa51
    id: r.options-is-the-only-wiring
    level: SHOULD
    text: Loggers should be produced only through Options via New or Discard, so format,
      default level, and the service attribute stay in one place.
  upstream: self
- code:
  - common/outputs/outputs.go
  - common/outputs/outputs_test.go
  id: sc.common-outputs
  intent: 'This context exists to fix the contract for converting arbitrary JSON-ish
    values into the string map that kcp surfaces as outputs. The two functions are
    the single place where that conversion rule lives, so the exec runner and the
    policy client cannot drift apart on how a number, boolean, or list becomes a string.
    The spec records the observable contract: nil in gives nil out, strings pass through
    unchanged, non-strings become their JSON encoding, and a value JSON cannot encode
    still yields a usable string rather than an error.'
  interfaces:
  - file: common/outputs/outputs.go
    kind: function
    name: Stringify
    signature: func Stringify(in map[string]any) map[string]string
  - file: common/outputs/outputs.go
    kind: function
    name: StringifyValue
    signature: func StringifyValue(value any) string
  name: common-outputs
  requirements:
  - codeRefs:
    - file:common/outputs/outputs_test.go
    - function:d16f38628fc00d680c6f54309865e821
    id: r.behavior-is-tested
    level: SHOULD
    text: TestStringify covers nil input, a plain string, a number, a boolean, and
      a list, pinning the documented conversions.
  - codeRefs:
    - file:common/outputs/outputs.go
    - function:d16f38628fc00d680c6f54309865e821
    id: r.empty-input-gives-nil
    level: MUST
    text: Stringify returns nil, not an empty map, when the input map is nil or has
      length zero.
  - codeRefs:
    - function:1f7915d8cd9aa1f3759d833f5af90128
    - function:d16f38628fc00d680c6f54309865e821
    id: r.every-entry-stringified
    level: MUST
    text: Stringify returns a map holding the same keys as the input, where each value
      is the result of StringifyValue applied to the input value.
  - codeRefs:
    - function:1f7915d8cd9aa1f3759d833f5af90128
    id: r.marshal-failure-falls-back
    level: MUST
    text: StringifyValue returns fmt.Sprint of the value when json.Marshal fails,
      so the function never returns an error and never panics on an unencodable value.
  - codeRefs:
    - file:common/outputs/outputs.go
    - function:1f7915d8cd9aa1f3759d833f5af90128
    id: r.non-strings-json-encoded
    level: MUST
    text: StringifyValue returns the JSON encoding of a value that is not a string,
      so numbers become bare numerals, booleans become true or false, and lists become
      compact JSON arrays.
  - codeRefs:
    - file:common/outputs/outputs.go
    - function:1f7915d8cd9aa1f3759d833f5af90128
    id: r.strings-pass-through
    level: MUST
    text: StringifyValue returns a value whose dynamic type is string unchanged, without
      quoting or escaping it.
  upstream: self
- code:
  - common/ref/ref.go
  - common/ref/ref_test.go
  id: sc.common-ref
  intent: This context exists so that every layer of kcp-libs agrees on the identity
    and the transport address of a KCP object. A Ref is the identity used as a map
    key, a cache index key and a workqueue key, so its string form must be stable
    and shared; BaseHost and ClusterURL exist so that callers holding either a bare
    host or a host that already carries a /clusters/<logicalCluster> path can still
    build a correct per-cluster URL. Keeping these helpers in one tiny package prevents
    the key format and the KCP API path prefix from being re-implemented, and diverging,
    in each consumer.
  interfaces:
  - file: common/ref/ref.go
    kind: function
    name: BaseHost
    signature: func BaseHost(host string) string
  - file: common/ref/ref.go
    kind: function
    name: ClusterURL
    signature: func ClusterURL(host, logicalCluster string) string
  - file: common/ref/ref.go
    kind: function
    name: Key
    signature: func Key(logicalCluster, namespace, name string) string
  - file: common/ref/ref.go
    kind: function
    name: New
    signature: func New(logicalCluster, namespace, name string) Ref
  - file: common/ref/ref.go
    kind: struct
    name: Ref
    signature: type Ref struct { LogicalCluster string; Namespace string; Name string;
      ResourceVersion string }
  - file: common/ref/ref.go
    kind: method
    name: Ref.Key
    signature: func (r Ref) Key() string
  - file: common/ref/ref.go
    kind: method
    name: Ref.WithNamespace
    signature: func (r Ref) WithNamespace(namespace string) Ref
  - file: common/ref/ref.go
    kind: method
    name: Ref.WithResourceVersion
    signature: func (r Ref) WithResourceVersion(version string) Ref
  name: common-ref
  requirements:
  - codeRefs:
    - file:common/ref/ref_test.go
    - function:757cbe1304d5ad40e0627224acf0be64
    id: r.base-host-normalization
    level: MUST
    text: BaseHost must remove a single trailing slash, and must truncate a host at
      the first occurrence of the /clusters/ API path prefix, so a host already scoped
      to a logical cluster reduces to the bare scheme and authority.
  - codeRefs:
    - file:common/ref/ref_test.go
    - function:4c5cf31e71ec19179fbbb42d890195d5
    id: r.cluster-url-build
    level: MUST
    text: ClusterURL must build the per-logical-cluster URL by normalizing the host
      with BaseHost and then appending the /clusters/ prefix and the logical cluster,
      so an already-scoped host does not accumulate a second cluster path.
  - codeRefs:
    - file:common/ref/ref_test.go
    - function:a77844fa6f24528303d849e5ed956c3c
    - method:4e7c59fd75778a303dccf1476257f32b
    id: r.key-format
    level: MUST
    text: The key of a reference must be the logical cluster, namespace and name joined
      by single slash characters, with no other separator or escaping, and both the
      free function and the method must produce exactly the same string.
  - codeRefs:
    - file:common/ref/ref.go
    - function:7999d84f451c59ca6a03577995281764
    id: r.new-leaves-resource-version-empty
    level: MUST
    text: New must construct a Ref from the three identity strings and must leave
      the resource version empty; a resource version is only ever set through the
      wither.
  - codeRefs:
    - file:common/ref/ref.go
    - struct:d0d183e54e296ffe32b06ffd08b347ca
    id: r.ref-carries-identity
    level: MUST
    text: A Ref must carry the logical cluster, the namespace, the object name and
      an optional resource version as its four exported fields, so consumers can read
      and compare identity without an accessor.
  - codeRefs:
    - file:common/ref/ref.go
    id: r.stdlib-only
    level: SHOULD
    text: The package should depend only on the standard library and must not import
      any kcp client, scheme or workload-runtime package, so every layer of the repository
      can depend on it without a cycle.
  - codeRefs:
    - file:common/ref/ref.go
    - method:2948085699170c0e8f98592fb74fedb5
    id: r.with-namespace-returns-copy
    level: SHOULD
    text: WithNamespace should return a Ref that carries the replacement namespace
      and otherwise keeps the receiver's fields unchanged, and should not mutate the
      receiver.
  - codeRefs:
    - file:common/ref/ref_test.go
    - method:a10e7cf01872c2cd075539e6dba8e9f4
    id: r.with-resource-version-returns-copy
    level: MUST
    text: WithResourceVersion must return a Ref that carries the given version and
      otherwise keeps the receiver's identity unchanged, and must not mutate the receiver.
  upstream: self
- code:
  - common/statuspatch/statuspatch.go
  - common/statuspatch/statuspatch_test.go
  id: sc.common-statuspatch
  intent: This context exists to specify the reusable patch-construction vocabulary
    shared by every reconcile and store layer in kcp-libs. It keeps the generic JSON-patch
    byte shapes in one place so controllers do not hand-roll status envelopes, resourceVersion
    stamps, or finalizer patches, and so the exact wire shape of those patches is
    pinned by unit tests rather than duplicated per consumer.
  interfaces:
  - file: common/statuspatch/statuspatch.go
    kind: function
    name: FinalizerAdd
    signature: func FinalizerAdd(finalizers []string) ([]byte, error)
  - file: common/statuspatch/statuspatch.go
    kind: function
    name: FinalizerRemove
    signature: func FinalizerRemove(current []string, dropped string) ([]byte, error)
  - file: common/statuspatch/statuspatch.go
    kind: function
    name: FinalizersOf
    signature: func FinalizersOf(body []byte) ([]string, error)
  - file: common/statuspatch/statuspatch.go
    kind: function
    name: Merge
    signature: func Merge(status map[string]any) ([]byte, error)
  - file: common/statuspatch/statuspatch.go
    kind: struct
    name: Metadata
    signature: type Metadata struct { Finalizers []string `json:"finalizers"` }
  - file: common/statuspatch/statuspatch.go
    kind: function
    name: WithResourceVersion
    signature: func WithResourceVersion(body []byte, version string) ([]byte, error)
  name: common-statuspatch
  requirements:
  - codeRefs:
    - file:common/statuspatch/statuspatch.go
    - function:973dee6f0664f3fb6b8b0860b5ec3a25
    id: r.finalizer-add-single-op
    level: MUST
    text: 'FinalizerAdd MUST encode a single-op JSON patch with op "add" at path /metadata/finalizers
      and the given finalizers as value, and MUST return a wrapped error prefixed
      "statuspatch: encode the finalizer patch:" on failure.'
  - codeRefs:
    - file:common/statuspatch/statuspatch.go
    - function:e6682cb9b4a0a03a95c84fedefb98805
    id: r.finalizer-remove-absent-no-patch
    level: MUST
    text: FinalizerRemove MUST return a nil body and nil error when the dropped finalizer
      is not present in current, so that no patch is sent.
  - codeRefs:
    - function:e6682cb9b4a0a03a95c84fedefb98805
    id: r.finalizer-remove-test-and-replace
    level: MUST
    text: 'FinalizerRemove MUST, when the finalizer is present, encode a two-operation
      JSON patch: first a "test" op on /metadata/finalizers with the original current
      list as value, then an "add" op on /metadata/finalizers with the remaining finalizers
      in their original order.'
  - codeRefs:
    - file:common/statuspatch/statuspatch.go
    - function:a0ef10c6d57cf09c7ea23871b9b2c059
    id: r.finalizers-of-reads-metadata
    level: MUST
    text: 'FinalizersOf MUST decode the body''s "metadata" member into Metadata and
      return its Finalizers list, returning a wrapped error prefixed "statuspatch:
      decode object metadata:" when decoding fails.'
  - codeRefs:
    - file:common/statuspatch/statuspatch.go
    - function:146b92aee570e1cccf066680c85a4988
    id: r.merge-wraps-status
    level: MUST
    text: 'Merge MUST encode the given status map as a JSON object under the top-level
      key "status", returning the encoded bytes, and MUST return a wrapped error prefixed
      "statuspatch: encode status:" if encoding fails.'
  - codeRefs:
    - file:common/statuspatch/statuspatch.go
    - struct:9ddae76e6ab972a834ddad24d5320169
    id: r.metadata-decodes-finalizers
    level: MUST
    text: Metadata MUST be an exported struct whose Finalizers field is a []string
      decoded from the JSON key "finalizers".
  - codeRefs:
    - file:common/statuspatch/statuspatch.go
    id: r.no-external-dependencies
    level: SHOULD
    text: The package SHOULD depend only on the standard library (encoding/json and
      fmt), keeping the generic patch layer usable without any workload runtime.
  - codeRefs:
    - function:e490ecee35ab297d47aa943e045c98b3
    id: r.resourceversion-decode-errors
    level: MUST
    text: 'WithResourceVersion MUST return a wrapped error prefixed "statuspatch:
      decode patch to stamp a resource version:" when the body is not a JSON object,
      and "statuspatch: encode patch with a resource version:" when re-encoding fails.'
  - codeRefs:
    - file:common/statuspatch/statuspatch.go
    - function:e490ecee35ab297d47aa943e045c98b3
    id: r.resourceversion-empty-passthrough
    level: MUST
    text: WithResourceVersion MUST return the input body unchanged when version is
      the empty string, without decoding or re-encoding it.
  - codeRefs:
    - file:common/statuspatch/statuspatch.go
    - function:e490ecee35ab297d47aa943e045c98b3
    id: r.resourceversion-stamps-metadata
    level: MUST
    text: WithResourceVersion MUST decode the body as a JSON object and replace its
      "metadata" member with an object carrying exactly the resourceVersion key set
      to the given version, then re-encode it.
  - codeRefs:
    - file:common/statuspatch/statuspatch_test.go
    id: r.tests-pin-wire-shape
    level: SHOULD
    text: The package's behaviour SHOULD be pinned by direct unit tests covering the
      status envelope, the resourceVersion stamp including the empty-version case,
      the test-and-replace finalizer patch, the absent-finalizer nil patch, the single
      add op, and reading finalizers from an object body.
  upstream: self
- code:
  - common/ttl/ttl.go
  - common/ttl/ttl_test.go
  id: sc.common-ttl
  intent: This context exists so callers do not each re-derive TTL semantics from
    raw pointers. Kubernetes-style APIs express TTLs as optional seconds on a timestamp,
    where nil means unset and negative is meaningless; these helpers centralize that
    normalization so every consumer agrees on when something is scheduled for deletion,
    and when nothing should be scheduled at all.
  interfaces:
  - file: common/ttl/ttl.go
    kind: function
    name: Deadline
    signature: func Deadline(start *metav1.Time, seconds *int64, now time.Time) bool
  - file: common/ttl/ttl.go
    kind: function
    name: Effective
    signature: func Effective(override, fallback *int64) *int64
  - file: common/ttl/ttl.go
    kind: function
    name: Expired
    signature: func Expired(completion *metav1.Time, seconds *int64, now time.Time)
      (expired bool, after time.Duration, known bool)
  - file: common/ttl/ttl.go
    kind: function
    name: Expiry
    signature: func Expiry(completion *metav1.Time, seconds *int64) (time.Time, bool)
  name: common-ttl
  requirements:
  - codeRefs:
    - file:common/ttl/ttl.go
    - function:9fdc74d33c3a88840f75732e3c0170bb
    id: r.deadline-unknown-without-start
    level: MUST
    text: Deadline returns false when start is nil, seconds is nil, or seconds is
      negative. Otherwise it returns true only when now is not before start plus seconds
      seconds.
  - codeRefs:
    - file:common/ttl/ttl.go
    - function:d687afb3744f79be091b78a990794a9d
    id: r.effective-prefers-override
    level: MUST
    text: Effective returns the value of override when override is not nil, otherwise
      the value of fallback. When the selected value is nil or negative, Effective
      returns nil. When it is non-negative, Effective returns a pointer to a copy
      of the value, never an alias of the input.
  - codeRefs:
    - function:503ea477e92bcc1bc7f9bdba99922323
    - function:a0c1200f8b55a18bfa918f1f0cee7615
    id: r.expired-reports-unknown
    level: MUST
    text: Expired returns (false, 0, false) when no expiry is known, that is when
      Expiry reports false. When the expiry is known and now is not before it, Expired
      returns (true, 0, true). When the expiry is in the future, Expired returns (false,
      expiry.Sub(now), true).
  - codeRefs:
    - file:common/ttl/ttl.go
    - function:503ea477e92bcc1bc7f9bdba99922323
    id: r.expiry-needs-completion-and-seconds
    level: MUST
    text: Expiry returns the zero time and false when completion is nil, seconds is
      nil, or seconds is negative. Otherwise it returns completion plus seconds seconds
      and true.
  - codeRefs:
    - function:503ea477e92bcc1bc7f9bdba99922323
    - function:9fdc74d33c3a88840f75732e3c0170bb
    - function:d687afb3744f79be091b78a990794a9d
    id: r.negative-seconds-mean-unset
    level: MUST
    text: 'A negative seconds value is treated exactly like an unset one across Effective,
      Expiry and Deadline: no expiry and no deadline are produced.'
  - codeRefs:
    - file:common/ttl/ttl_test.go
    - function:9fdc74d33c3a88840f75732e3c0170bb
    - function:a0c1200f8b55a18bfa918f1f0cee7615
    id: r.tests-cover-boundaries
    level: SHOULD
    text: The tests cover override preference and negative rejection in Effective,
      a future expiry, a past expiry and a missing completion time in Expired, and
      a future deadline, a reached deadline and a missing start time in Deadline.
  upstream: self
- code:
  - examples/admission/main.go
  - examples/admission/main_test.go
  id: sc.examples-admission
  intent: 'This context exists so that the admission example can be described and
    regenerated as a compile-checked demonstration of the admission Source interface.
    It documents the exact contract an implementer must satisfy: how a parent is discovered
    from a run (a label lookup that may legitimately find nothing), how child runs
    are enumerated and filtered by that same label, and how capacity is derived from
    the parent batch, including the not-found case which must surface as a Blocker
    rather than an error. Keeping the spec anchored to these methods lets changes
    to the queue capacity and blocker types be validated against a real consumer.'
  interfaces:
  - file: examples/admission/main.go
    kind: function
    name: Run
    signature: func Run(ctx context.Context, out io.Writer) error
  - file: examples/admission/main.go
    kind: method
    name: source.Capacity
    signature: func (s source) Capacity(ctx context.Context, parent ref.Ref) (queue.Capacity,
      *queue.Blocker, error)
  - file: examples/admission/main.go
    kind: method
    name: source.Parent
    signature: func (s source) Parent(ctx context.Context, run queue.Run) (ref.Ref,
      bool, error)
  - file: examples/admission/main.go
    kind: method
    name: source.Runs
    signature: func (s source) Runs(ctx context.Context, parent ref.Ref) ([]queue.Run,
      error)
  name: examples-admission
  requirements:
  - codeRefs:
    - method:4b1c829db1dd2db486e75edae8ec99f8
    id: r.capacity-from-batch-spec
    level: MUST
    text: source.Capacity must read the parent batch object and return a queue.Capacity
      carrying the batch spec concurrency policy and max concurrent value.
  - codeRefs:
    - file:examples/admission/main.go
    - method:4b1c829db1dd2db486e75edae8ec99f8
    id: r.capacity-missing-batch-is-blocker
    level: MUST
    text: source.Capacity must return a queue.Blocker with reason BatchMissing and
      message "the parent batch does not exist" when the batch lookup reports not
      found via kcpstore.IsNotFound, and must return any other lookup error unchanged
      instead.
  - codeRefs:
