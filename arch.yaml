apiVersion: open-architecture.dffml.github.io/v0alpha1
kind: OpenArchitecture
metadata:
  branch: open-architecture/kcp-libs
  name: kcp-libs
system_contexts:
- code:
  - abc/cache/cache.go
  - abc/cache/cache_test.go
  id: sc.abc-cache
  intent: 'This context exists so a reader can see what the cache promises without
    reading the implementation: which index contract an object store must satisfy,
    how a Set fans a lookup out over several indexers of the same kind, and which
    field extractors the library offers for objects it did not define. It also fixes
    the indexer set that IndexersFor derives from the configured labels, which is
    the seam the surrounding reconcile and informer layers plug into.'
  interfaces:
  - file: abc/cache/cache.go
    kind: function
    name: ClusterOf
    signature: func ClusterOf(obj any) string
  - file: abc/cache/cache.go
    kind: function
    name: Decode
    signature: func Decode(obj any) (*T, error)
  - file: abc/cache/cache.go
    kind: type_alias
    name: IndexFunc
    signature: type IndexFunc
  - file: abc/cache/cache.go
    kind: interface
    name: Indexer
    signature: type Indexer interface
  - file: abc/cache/cache.go
    kind: method
    name: Indexer.ByIndex
    signature: func (Indexer) ByIndex(indexName, indexedValue string) ([]any, error)
  - file: abc/cache/cache.go
    kind: method
    name: Indexer.GetByKey
    signature: func (Indexer) GetByKey(key string) (item any, exists bool, err error)
  - file: abc/cache/cache.go
    kind: method
    name: Indexer.List
    signature: func (Indexer) List() []any
  - file: abc/cache/cache.go
    kind: type_alias
    name: Indexers
    signature: type Indexers
  - file: abc/cache/cache.go
    kind: function
    name: IndexersFor
    signature: func IndexersFor(parentLabel, jobLabel, triggerPodField string) Indexers
  - file: abc/cache/cache.go
    kind: function
    name: NameOf
    signature: func NameOf(obj any) string
  - file: abc/cache/cache.go
    kind: function
    name: NestedString
    signature: func NestedString(obj any, fields ...string) string
  - file: abc/cache/cache.go
    kind: function
    name: NewSet
    signature: func NewSet() *Set
  - file: abc/cache/cache.go
    kind: function
    name: PhaseOf
    signature: func PhaseOf(obj any) string
  - file: abc/cache/cache.go
    kind: function
    name: RefOf
    signature: func RefOf(obj any) (ref.Ref, bool)
  - file: abc/cache/cache.go
    kind: struct
    name: Set
    signature: type Set struct
  - file: abc/cache/cache.go
    kind: method
    name: Set.Add
    signature: func (*Set) Add(kind string, indexer Indexer)
  - file: abc/cache/cache.go
    kind: method
    name: Set.ByIndex
    signature: func (*Set) ByIndex(kind, index, value string) []any
  - file: abc/cache/cache.go
    kind: method
    name: Set.Get
    signature: func (*Set) Get(kind string, r ref.Ref) (any, bool)
  - file: abc/cache/cache.go
    kind: method
    name: Set.List
    signature: func (*Set) List(kind string) []any
  - file: abc/cache/cache.go
    kind: method
    name: Set.Names
    signature: func (*Set) Names(kind, index, value string) []string
  name: abc-cache
  requirements:
  - codeRefs:
    - method:2f035c41d933e105b559d662a9a88767
    - method:436e0dc34ebdec584138d188650d491e
    id: r.byindex-skips-errors
    level: MUST
    text: Set.ByIndex concatenates ByIndex results across the indexers of a kind and
      skips any indexer that returns an error, so one failing store cannot fail the
      whole lookup.
  - codeRefs:
    - function:ac84053b66aaf34b0c83c98bd076de38
    id: r.decode-to-type
    level: SHOULD
    text: Decode turns an unstructured object into a typed value, returning an error
      when the conversion fails.
  - codeRefs:
    - method:3cf5981edb352b4ae0f722e3ed6bb96c
    - method:7dedfffcc434baa8546c274ac5fa4131
    id: r.get-first-hit
    level: MUST
    text: Set.Get asks the indexers of a kind in registered order and returns the
      first object whose GetByKey reports exists, with false when no indexer has it.
  - codeRefs:
    - interface:83657a0a0b8c546e00b0f6ddd68c8e0a
    - method:2f035c41d933e105b559d662a9a88767
    - method:3cf5981edb352b4ae0f722e3ed6bb96c
    - method:e8d2e2d111f92694f5202ff04b380d0c
    id: r.indexer-contract
    level: MUST
    text: 'An Indexer offers exactly three reads: GetByKey for one key with an exists
      flag and an error, ByIndex for the objects carrying a value under a named index,
      and List for all objects.'
  - codeRefs:
    - method:79db186239dd9ebf94db73d3c1834051
    - method:e8d2e2d111f92694f5202ff04b380d0c
    id: r.list-concatenates
    level: MUST
    text: Set.List returns the concatenation of List from every indexer registered
      under a kind.
  - codeRefs:
    - function:368cfc3b7333cde3fc16c28b5f4a251e
    - method:995ab025f452ec7f8d6ac24f85f6bbba
    - struct:b3ef85326db0e635df938cf47a312813
    id: r.multi-indexer-registry
    level: MUST
    text: A Set holds a list of indexers per object kind. Set.Add appends an Indexer
      under a kind, so several stores can back the same kind.
  - codeRefs:
    - function:53a9fed74460c17bc06521cc3e273e8c
    - method:23f07591814f8acee78325cb538a547d
    id: r.names-from-index
    level: MUST
    text: Set.Names returns the names of the objects found at an index value through
      Set.ByIndex, using NameOf on each object.
  - codeRefs:
    - function:cf99478a03753478fb8bd3cc621df402
    id: r.nested-field-walk
    level: MUST
    text: NestedString walks a list of nested field names on an object and returns
      the string found there.
  - codeRefs:
    - function:323ee6d71bcc903db5a96ba67a3e1292
    - function:3b4476e3e6d3931e3e5f66d88938a0d2
    - function:53a9fed74460c17bc06521cc3e273e8c
    - function:7b1ca2f92d1acfeb4fc9be87c387a001
    id: r.object-field-extractors
    level: MUST
    text: 'The package reads common fields off unstructured objects: ClusterOf returns
      the cluster, RefOf returns a ref.Ref with a found flag, NameOf returns the name
      and PhaseOf returns the phase.'
  - codeRefs:
    - function:5ce1c083464f112da22046a1de3a5518
    - type_alias:a2a398908517249bfded29f79dbe609e
    - type_alias:c324eb8aebee5659b8c3144e047c30a2
    id: r.standard-indexers
    level: MUST
    text: IndexersFor builds an Indexers map from a parent label, a job label and
      a trigger pod field, so callers get the standard index set from configuration.
  - codeRefs:
    - file:abc/cache/cache.go
    - file:abc/cache/cache_test.go
    id: r.tested-against-fake-indexer
    level: SHOULD
    text: The Set behaviour is exercised in abc/cache/cache_test.go against a fake
      indexer whose ByIndex uses IndexersFor with the policy workflow pod label, the
      job run label and the policyWorkflowPod field.
  upstream: self
- code:
  - abc/joballoc/joballoc.go
  - abc/joballoc/joballoc_test.go
  id: sc.abc-joballoc
  intent: 'This context exists so the abc layer has one place that answers which names
    a job already holds and which of those a controller has not yet seen, without
    each consumer keeping its own bookkeeping. It is deliberately runtime-agnostic:
    it names no workload runtime and depends only on common/ref and common/expiringmap,
    so any reconciler in the repo can use it. Expiry comes from the shared expiringmap
    rather than from a timer here, which keeps the allocator free of goroutines and
    makes every read testable against an explicit now.'
  interfaces:
  - file: abc/joballoc/joballoc.go
    kind: struct
    name: Allocation
    signature: type Allocation struct { Name string; At time.Time }
  - file: abc/joballoc/joballoc.go
    kind: struct
    name: Allocator
    signature: type Allocator struct { byJob *expiringmap.Map[ref.Ref, []Allocation]
      }
  - file: abc/joballoc/joballoc.go
    kind: method
    name: Allocator.Allocate
    signature: func (a *Allocator) Allocate(r ref.Ref, names []string, now time.Time)
  - file: abc/joballoc/joballoc.go
    kind: method
    name: Allocator.Forget
    signature: func (a *Allocator) Forget(r ref.Ref)
  - file: abc/joballoc/joballoc.go
    kind: method
    name: Allocator.Len
    signature: func (a *Allocator) Len() int
  - file: abc/joballoc/joballoc.go
    kind: method
    name: Allocator.Names
    signature: func (a *Allocator) Names(r ref.Ref, now time.Time) []string
  - file: abc/joballoc/joballoc.go
    kind: method
    name: Allocator.Pending
    signature: func (a *Allocator) Pending(r ref.Ref, observed []string, now time.Time)
      []string
  - file: abc/joballoc/joballoc.go
    kind: function
    name: MergeNames
    signature: func MergeNames(groups ...[]string) []string
  - file: abc/joballoc/joballoc.go
    kind: function
    name: New
    signature: func New(ttl time.Duration) *Allocator
  name: abc-joballoc
  requirements:
  - codeRefs:
    - method:1d809a0f9cc0db66dd09568aab52e10e
    - struct:c6c45587967912c642f434fc5c395fac
    id: r.allocate-appends-and-skips-empty
    level: MUST
    text: 'Allocator.Allocate returns immediately when names is empty, and otherwise
      reads the existing allocations for the ref and appends one Allocation{Name,
      At: now} per name before setting the result back.'
  - codeRefs:
    - method:10aee9a9b59c82c429e59eda7063cff2
    id: r.forget-deletes-the-job
    level: MUST
    text: Allocator.Forget deletes the ref's entry from the underlying map.
  - codeRefs:
    - method:99144fd4f43e31bdffe2206a3a99a050
    id: r.len-reports-held-jobs
    level: MUST
    text: Allocator.Len returns the number of entries the underlying map currently
      holds.
  - codeRefs:
    - function:3f2d8c8fe1fe9a1ffe2aec6ae9cb21b1
    id: r.merge-names-order-preserving-dedupe
    level: MUST
    text: MergeNames concatenates the given groups in order, dropping empty names
      and names already emitted, so the result keeps first-seen order with no duplicates.
  - codeRefs:
    - method:2fe2fe5409de2aff6260db2ad57424e1
    id: r.names-nil-when-absent-or-empty
    level: MUST
    text: Allocator.Names returns nil when the ref has no live entry or the entry
      holds no allocations, and otherwise returns the allocation names in stored order.
  - codeRefs:
    - file:abc/joballoc/joballoc.go
    - function:e5835aa23953e8fe5e8ba0521c6f6305
    - struct:81a3d6c6679a07f9c85fcbb079cd24ef
    id: r.new-wires-expiring-map-with-ttl
    level: MUST
    text: New returns an Allocator whose byJob map is an expiringmap.Map keyed by
      ref.Ref holding []Allocation, created with the given ttl.
  - codeRefs:
    - method:9c2e809f72d7951e74cf7925860610ec
    id: r.pending-excludes-observed-and-dedupes
    level: MUST
    text: Allocator.Pending returns nil when the ref has no live entry, and otherwise
      returns the allocated names not present in observed, skipping any name already
      emitted so the result carries no duplicates.
  - codeRefs:
    - method:1d809a0f9cc0db66dd09568aab52e10e
    - method:2fe2fe5409de2aff6260db2ad57424e1
    - method:9c2e809f72d7951e74cf7925860610ec
    id: r.reads-honour-explicit-now
    level: MUST
    text: Every read and write takes an explicit now time.Time and passes it to the
      expiringmap, so expiry is decided by the caller's clock and not by the allocator.
  upstream: self
- code:
  - abc/pki/pki.go
  id: sc.abc-pki
  intent: This context exists to fix the boundary between the reconciler/provisioner
    code and the certificate authority backend. It names the operations a PKI backend
    must offer in terms of namespaces, mounts, roles and certificate issuance, so
    that an OpenBao-backed implementation (impl/openbaoclient) and a caching, idempotent
    wrapper (impl/pkiprovisioner) can be swapped without the consumers changing. The
    data carriers mirror the JSON field names the backend returns, which lets the
    implementations decode responses directly.
  interfaces:
  - file: abc/pki/pki.go
    kind: struct
    name: Authority
    signature: type Authority struct { Namespace string; CommonName string; Serial
      string; Chain string }
  - file: abc/pki/pki.go
    kind: struct
    name: Cert
    signature: type Cert struct { Certificate string `json:"certificate"`; PrivateKey
      string `json:"private_key"`; IssuingCA string `json:"issuing_ca"`; CAChain []string
      `json:"ca_chain"`; Serial string `json:"serial_number"` }
  - file: abc/pki/pki.go
    kind: struct
    name: CertRequest
    signature: type CertRequest struct { CommonName string; AltNames []string; IPSANs
      []string; TTL string }
  - file: abc/pki/pki.go
    kind: interface
    name: Client
    signature: type Client interface { EnsureNamespace(ctx context.Context, path string)
      error; EnsureMount(ctx context.Context, namespace, path, kind string) error;
      GenerateRoot(ctx context.Context, namespace, mount, commonName, ttl string)
      (RootCA, error); CASerial(ctx context.Context, namespace, mount string) (string,
      error); CAChain(ctx context.Context, namespace, mount string) (string, error);
      GenerateIntermediate(ctx context.Context, namespace, mount, commonName string)
      (IntermediateCSR, error); SignIntermediate(ctx context.Context, rootNamespace,
      mount, csr, commonName, ttl string) (string, error); SetSignedIntermediate(ctx
      context.Context, namespace, mount, chain string) error; WriteRole(ctx context.Context,
      namespace, mount, name string, role Role) error; Issue(ctx context.Context,
      namespace, mount, role string, req CertRequest) (Cert, error); DeleteNamespace(ctx
      context.Context, path string) error }
  - file: abc/pki/pki.go
    kind: method
    name: Client.CAChain
    signature: CAChain(ctx context.Context, namespace, mount string) (string, error)
  - file: abc/pki/pki.go
    kind: method
    name: Client.CASerial
    signature: CASerial(ctx context.Context, namespace, mount string) (string, error)
  - file: abc/pki/pki.go
    kind: method
    name: Client.DeleteNamespace
    signature: DeleteNamespace(ctx context.Context, path string) error
  - file: abc/pki/pki.go
    kind: method
    name: Client.EnsureMount
    signature: EnsureMount(ctx context.Context, namespace, path, kind string) error
  - file: abc/pki/pki.go
    kind: method
    name: Client.EnsureNamespace
    signature: EnsureNamespace(ctx context.Context, path string) error
  - file: abc/pki/pki.go
    kind: method
    name: Client.GenerateIntermediate
    signature: GenerateIntermediate(ctx context.Context, namespace, mount, commonName
      string) (IntermediateCSR, error)
  - file: abc/pki/pki.go
    kind: method
    name: Client.GenerateRoot
    signature: GenerateRoot(ctx context.Context, namespace, mount, commonName, ttl
      string) (RootCA, error)
  - file: abc/pki/pki.go
    kind: method
    name: Client.Issue
    signature: Issue(ctx context.Context, namespace, mount, role string, req CertRequest)
      (Cert, error)
  - file: abc/pki/pki.go
    kind: method
    name: Client.SetSignedIntermediate
    signature: SetSignedIntermediate(ctx context.Context, namespace, mount, chain
      string) error
  - file: abc/pki/pki.go
    kind: method
    name: Client.SignIntermediate
    signature: SignIntermediate(ctx context.Context, rootNamespace, mount, csr, commonName,
      ttl string) (string, error)
  - file: abc/pki/pki.go
    kind: method
    name: Client.WriteRole
    signature: WriteRole(ctx context.Context, namespace, mount, name string, role
      Role) error
  - file: abc/pki/pki.go
    kind: struct
    name: Health
    signature: type Health struct { Initialized bool `json:"initialized"`; Sealed
      bool `json:"sealed"`; Standby bool `json:"standby"`; Version string `json:"version"`
      }
  - file: abc/pki/pki.go
    kind: struct
    name: IntermediateCSR
    signature: type IntermediateCSR struct { CSR string `json:"csr"`; PrivateKey string
      `json:"private_key"` }
  - file: abc/pki/pki.go
    kind: interface
    name: Provisioner
    signature: type Provisioner interface { EnsureRoot(ctx context.Context) (RootCA,
      error); EnsureAuthority(ctx context.Context, path string) (Authority, error);
      Issue(ctx context.Context, path, commonName string, altNames, ips []string)
      (Cert, error); Delete(ctx context.Context, path string) error; CachedRootPEM()
      []byte }
  - file: abc/pki/pki.go
    kind: method
    name: Provisioner.CachedRootPEM
    signature: CachedRootPEM() []byte
  - file: abc/pki/pki.go
    kind: method
    name: Provisioner.Delete
    signature: Delete(ctx context.Context, path string) error
  - file: abc/pki/pki.go
    kind: method
    name: Provisioner.EnsureAuthority
    signature: EnsureAuthority(ctx context.Context, path string) (Authority, error)
  - file: abc/pki/pki.go
    kind: method
    name: Provisioner.EnsureRoot
    signature: EnsureRoot(ctx context.Context) (RootCA, error)
  - file: abc/pki/pki.go
    kind: method
    name: Provisioner.Issue
    signature: Issue(ctx context.Context, path, commonName string, altNames, ips []string)
      (Cert, error)
  - file: abc/pki/pki.go
    kind: struct
    name: Role
    signature: type Role struct { AllowedDomains []string; AllowSubdomains bool; AllowBareDomains
      bool; EnforceHostnames bool; KeyType string; KeyBits int; MaxTTL string }
  - file: abc/pki/pki.go
    kind: struct
    name: RootCA
    signature: type RootCA struct { Certificate string `json:"certificate"`; Serial
      string `json:"serial_number"` }
  name: abc-pki
  requirements:
  - codeRefs:
    - method:4d425dba0f4b78f1a408107711c732c9
    - struct:8a0cbed52cfc7319d1c688ca4591bcde
    id: r.generate-root
    level: MUST
    text: The Client interface MUST let a caller generate a root CA from namespace,
      mount, common name and TTL, returning a RootCA carrying certificate and serial.
  - codeRefs:
    - struct:5cbcf189d4f2f7d225d0f3a6d193daba
    id: r.health-shape
    level: SHOULD
    text: Health SHOULD describe a backend as Initialized, Sealed, Standby and Version,
      with the first three as bool and Version as string.
  - codeRefs:
    - method:1a3b315f017de0b6363a1ddf04e98077
    - method:98d06874b98400ca735ca49933dad7ef
    - struct:dde1ada7f0bec070360f060f452e6f67
    id: r.intermediate-pair
    level: MUST
    text: 'The Client interface MUST support the intermediate flow as a pair: GenerateIntermediate
      returns an IntermediateCSR with CSR and private key, and SignIntermediate takes
      the root namespace, mount, CSR, common name and TTL and returns the signed chain.'
  - codeRefs:
    - method:d58fe4f006f8d8e6d8b06298f11c8b3b
    - struct:6183e1fd5203660f7cc37a020f980a05
    - struct:faad17686720ec66a377bf0b42fa729b
    id: r.issue-certificate
    level: MUST
    text: The Client interface MUST issue a certificate from namespace, mount, role
      and a CertRequest (CommonName, AltNames, IPSANs, TTL), returning a Cert with
      Certificate, PrivateKey, IssuingCA, CAChain and Serial.
  - codeRefs:
    - struct:5cbcf189d4f2f7d225d0f3a6d193daba
    - struct:8a0cbed52cfc7319d1c688ca4591bcde
    - struct:dde1ada7f0bec070360f060f452e6f67
    - struct:faad17686720ec66a377bf0b42fa729b
    id: r.json-tags
    level: SHOULD
    text: Cert, RootCA, IntermediateCSR and Health SHOULD keep their JSON tags (certificate,
      private_key, issuing_ca, ca_chain, serial_number, csr, initialized, sealed,
      standby, version) so responses decode without a mapping layer.
  - codeRefs:
    - method:b8d03e6b65634b9f495bc2f2a1019a7a
    id: r.mount-kind
    level: MUST
    text: The Client interface MUST let a caller ensure a mount inside a namespace,
      taking the namespace, the path and the mount kind.
  - codeRefs:
    - method:07fd1814798e353c56f080d20975fb4b
    - method:a0ac8a2dec0c7669af33019b4b3f3f11
    id: r.namespace-lifecycle
    level: MUST
    text: The Client interface MUST let a caller create a namespace (EnsureNamespace)
      and remove a namespace (DeleteNamespace), each addressed by path and returning
      error.
  - codeRefs:
    - file:abc/pki/pki.go
    id: r.package-defaults
    level: MUST
    text: The package MUST define DefaultMount "pki", DefaultRole "denopod", DefaultRootCommonName
      "kcp-mesh-root", DefaultRootTTL "87600h", DefaultIntermediateTTL "43800h" and
      DefaultLeafTTL "720h" as constants.
  - codeRefs:
    - method:17a2eb40b863f13c4652261820c10201
    id: r.provisioner-cached-root-pem
    level: MUST
    text: Provisioner.CachedRootPEM MUST return the root certificate as bytes with
      no error and no context, so callers can read it without an authority round trip.
  - codeRefs:
    - method:808f1bb5f4e1aa53fcaf0a2c6358d976
    id: r.provisioner-delete
    level: MUST
    text: Provisioner.Delete MUST take a path and return error, so a reconciled path
      can be torn down.
  - codeRefs:
    - method:fd34639484fd56a10516d8affbd6fdcf
    - struct:af3fa7e349cc30c48784cf7c88c90f63
    id: r.provisioner-ensure-authority
    level: MUST
    text: Provisioner.EnsureAuthority MUST take a path and return an Authority carrying
      Namespace, CommonName, Serial and Chain.
  - codeRefs:
    - method:e4543be178161016ecceb88b21d2e99b
    id: r.provisioner-ensure-root
    level: MUST
    text: Provisioner.EnsureRoot MUST return the RootCA for the provisioner's own
      root without the caller naming namespace or mount.
  - codeRefs:
    - method:1f9f2bb7abd96f807c5e53ee523f2708
    id: r.provisioner-issue
    level: MUST
    text: Provisioner.Issue MUST take a path, common name, alternative names and IPs
      and return a Cert, hiding mount, role and TTL from the caller.
  - codeRefs:
    - interface:44a17e9c183e31e9b666d01dca913cc8
    id: r.provisioner-surface
    level: MUST
    text: The Provisioner interface MUST offer EnsureRoot, EnsureAuthority, Issue,
      Delete and CachedRootPEM as its whole method set.
  - codeRefs:
    - method:1e2aa7ebdb54224f489e406f6f3fbef3
    - method:1ef93b250b4f7c625d04067f81349bf9
    id: r.read-ca-serial-and-chain
    level: MUST
    text: The Client interface MUST expose the CA serial and the CA chain of a mount
      as separate string reads (CASerial, CAChain).
  - codeRefs:
    - file:abc/pki/pki.go
    id: r.sentinel-no-authority
    level: MUST
    text: The package MUST export ErrNoAuthority, an error value meaning the namespace
      holds no authority yet.
  - codeRefs:
    - method:ee3e7f50bd6547ee6827b49a28baa253
    id: r.set-signed-intermediate
    level: MUST
    text: The Client interface MUST let a caller install a signed intermediate chain
      into namespace and mount (SetSignedIntermediate).
  - codeRefs:
    - method:eb7720c010c0ac34cb5e99ee48495951
    - struct:1331436d9816e3e86d68a77c31bda5af
    id: r.write-role
    level: MUST
    text: The Client interface MUST let a caller write a named Role into a namespace
      and mount; Role carries AllowedDomains, AllowSubdomains, AllowBareDomains, EnforceHostnames,
      KeyType, KeyBits and MaxTTL.
  upstream: self
- code:
  - abc/policy/policy.go
  id: sc.abc-policy
  intent: This context exists so that consumers of a policy engine depend on a stable,
    transport-free contract instead of a concrete HTTP client. It defines the vocabulary
    and signatures that an implementation such as impl/policyclient must satisfy,
    and the shape of the task status that callers poll after submission. Keeping the
    contract in abc/policy lets the engine endpoint stay a per-call argument, so one
    Client talks to many policy engines.
  interfaces:
  - file: abc/policy/policy.go
    kind: interface
    name: Client
    signature: type Client interface { Submit(ctx context.Context, endpoint string,
      workflow []byte, inputs map[string]string) (string, error); Status(ctx context.Context,
      endpoint, taskID string) (Task, error) }
  - file: abc/policy/policy.go
    kind: method
    name: Client.Status
    signature: Status(ctx context.Context, endpoint, taskID string) (Task, error)
  - file: abc/policy/policy.go
    kind: method
    name: Client.Submit
    signature: Submit(ctx context.Context, endpoint string, workflow []byte, inputs
      map[string]string) (string, error)
  - file: abc/policy/policy.go
    kind: struct
    name: Task
    signature: type Task struct { State string; ExitStatus string; Outputs map[string]string;
      Message string }
  name: abc-policy
  requirements:
  - codeRefs:
    - interface:3ec82f13ff355ba5c823fadd91cbc034
    - method:60e85e0780bae7128346127fea69a2e3
    - method:e1e87944f71f145e385b7bc3db9a5588
    id: r.client-contract
    level: MUST
    text: The package MUST export a Client interface whose Submit call returns a task
      identifier string and an error, and whose Status call returns a Task and an
      error.
  - codeRefs:
    - file:abc/policy/policy.go
    id: r.state-vocabulary
    level: MUST
    text: 'The package MUST define exactly three run states as string constants: StateRunning
      with value "running", StateSucceeded with value "succeeded", and StateFailed
      with value "failed".'
  - codeRefs:
    - method:e1e87944f71f145e385b7bc3db9a5588
    id: r.status-lookup
    level: MUST
    text: Status MUST identify a run by the engine endpoint plus the task identifier
      returned from Submit, and MUST accept a context for cancellation.
  - codeRefs:
    - method:60e85e0780bae7128346127fea69a2e3
    id: r.submit-inputs
    level: MUST
    text: Submit MUST take the engine endpoint as a string, the workflow as raw JSON
      bytes, and the run inputs as a map[string]string, and MUST accept a context
      for cancellation.
  - codeRefs:
    - struct:c1003284dadd5dbd150449f4f9af4ddc
    id: r.task-shape
    level: MUST
