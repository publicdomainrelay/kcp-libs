- code:
  - impl/exportwatch/exportwatch.go
  id: sc.impl-exportwatch
  intent: 'This context exists so callers can wait until a provider''s exports are
    actually reachable before proceeding: it isolates the endpoint-slice discovery,
    projection and readiness logic from any workload runtime, gives a single place
    where the provider workspace is appended to the API host path, and exposes both
    a blocking wait (Await) and a watch-driven wait (WatchEndpointSlices) over the
    same Options.'
  interfaces:
  - file: impl/exportwatch/exportwatch.go
    kind: function
    name: Await
    signature: func Await(ctx context.Context, opts Options) (Endpoints, error)
  - file: impl/exportwatch/exportwatch.go
    kind: function
    name: Client
    signature: func Client(opts Options) (dynamic.Interface, error)
  - file: impl/exportwatch/exportwatch.go
    kind: function
    name: Discover
    signature: func Discover(ctx context.Context, opts Options) (Endpoints, error)
  - file: impl/exportwatch/exportwatch.go
    kind: type_alias
    name: Endpoints
    signature: type Endpoints map[string][]string
  - file: impl/exportwatch/exportwatch.go
    kind: method
    name: Endpoints.Ready
    signature: func (e Endpoints) Ready(exports ...string) bool
  - file: impl/exportwatch/exportwatch.go
    kind: function
    name: FromList
    signature: func FromList(list *unstructured.UnstructuredList) Endpoints
  - file: impl/exportwatch/exportwatch.go
    kind: struct
    name: Options
    signature: type Options struct
  - file: impl/exportwatch/exportwatch.go
    kind: function
    name: Paths
    signature: func Paths(endpoints Endpoints, export string) []string
  - file: impl/exportwatch/exportwatch.go
    kind: function
    name: WatchEndpointSlices
    signature: func WatchEndpointSlices(ctx context.Context, opts Options, wait time.Duration)
      error
  name: impl-exportwatch
  requirements:
  - codeRefs:
    - function:0e22ac2739d17dd3caab2abd75c390e0
    - function:48d584db657cf9d26e0c376b34aa6773
    - struct:99a8a7585a6b5d30375c471a8fb38c71
    id: r.await-returns-discovered-endpoints
    level: MUST
    text: Await takes the same options as Discover and returns the discovered Endpoints
      once they are ready, so a blocking wait and a one-shot discovery share one configuration.
  - codeRefs:
    - function:efb61af66b10e227581818288975a28e
    id: r.client-requires-config
    level: MUST
    text: 'Client refuses a nil rest config with the error "exportwatch: a rest config
      is required", so a client is never built without one.'
  - codeRefs:
    - function:efb61af66b10e227581818288975a28e
    - struct:99a8a7585a6b5d30375c471a8fb38c71
    id: r.client-scopes-host-to-workspace
    level: MUST
    text: Client applies the client limit tuning to the config and rewrites the host
      to the options host plus the API path prefix plus the provider workspace, so
      every request is scoped to that workspace.
  - codeRefs:
    - function:0e22ac2739d17dd3caab2abd75c390e0
    - function:4855b61ac47e7bbc0bb211b8661e9d59
    id: r.discover-lists-endpoint-slices
    level: MUST
    text: 'Discover builds a client from the options, lists the endpoint slice resource,
      and wraps a list failure as "exportwatch: list the endpoint slices: %w"; on
      success it returns FromList of the result.'
  - codeRefs:
    - file:impl/exportwatch/exportwatch.go
    - type_alias:94252f87faff3176628078b9500af709
    id: r.endpoints-map-shape
    level: MUST
    text: Endpoint addresses are held as a map from export name to a slice of URL
      strings, so one export can carry several addresses.
  - codeRefs:
    - function:4855b61ac47e7bbc0bb211b8661e9d59
    id: r.fromlist-reads-export-and-urls
    level: MUST
    text: FromList reads spec.export.name from each item and the url of each entry
      in status.endpoints, skipping items with no export name and entries with no
      url, and appends the urls under that export name.
  - codeRefs:
    - function:efb61af66b10e227581818288975a28e
    - struct:99a8a7585a6b5d30375c471a8fb38c71
    id: r.options-carries-host-resolution
    level: MAY
    text: Options exposes an unexported host method that yields the API host, so the
      host derivation stays with the options that describe the provider workspace.
  - codeRefs:
    - function:96edd4eb5a20bcded694ab307fa5f365
    - type_alias:94252f87faff3176628078b9500af709
    id: r.paths-renders-one-export
    level: MUST
    text: Paths takes the discovered Endpoints and a single export name and returns
      that export's addresses as a string slice.
  - codeRefs:
    - method:631983bf08fd7d3133061275ab1f910d
    id: r.ready-requires-every-export
    level: MUST
    text: Endpoints.Ready reports false when any named export has zero addresses and
      true only when every named export has at least one.
  - codeRefs:
    - function:b185d3ac6de1d5bfcfd671f7afeca0c2
    id: r.watch-bounds-itself
    level: MUST
    text: WatchEndpointSlices derives a context bounded by the wait duration, stops
      the watch on return, and reports success (nil) when that context ends or the
      result channel closes.
  - codeRefs:
    - function:0e22ac2739d17dd3caab2abd75c390e0
    - function:b185d3ac6de1d5bfcfd671f7afeca0c2
    - method:631983bf08fd7d3133061275ab1f910d
    id: r.watch-signals-readiness
    level: MUST
    text: On an Added, Modified or Deleted event WatchEndpointSlices rediscovers the
      endpoints and returns ErrReady as soon as the options exports are ready; a failed
      rediscovery is ignored rather than fatal.
  upstream: self
- code:
  - impl/informerwatch/informerwatch.go
  - impl/informerwatch/informerwatch_test.go
  id: sc.impl-informerwatch
  intent: 'This context exists so the kcp-libs dynamic watching layer is described
    as it is written: a runtime-neutral informer bootstrap that turns kcp object events
    into enqueue calls and optional reactor callbacks, with the indexer, cache set
    and reactor hooks injected by the caller. It names no workload runtime and is
    reusable without the deno packages.'
  interfaces:
  - file: impl/informerwatch/informerwatch.go
    kind: type_alias
    name: Enqueue
    signature: type Enqueue func(kind string, r ref.Ref)
  - file: impl/informerwatch/informerwatch.go
    kind: struct
    name: Options
    signature: "type Options struct {\n\tConfig *rest.Config\n\n\tSources []Source\n\n\tIndexers
      cache.Indexers\n\n\tSet *cache.Set\n\n\tReactor Reactor\n\n\tEnqueue Enqueue\n\n\tOnEvent
      func()\n}"
  - file: impl/informerwatch/informerwatch.go
    kind: interface
    name: Reactor
    signature: "type Reactor interface {\n\tAdded(kind string, obj *unstructured.Unstructured,
      enqueue Enqueue)\n\n\tUpdated(kind string, old, obj *unstructured.Unstructured,
      enqueue Enqueue)\n}"
  - file: impl/informerwatch/informerwatch.go
    kind: method
    name: Reactor.Added
    signature: Added(kind string, obj *unstructured.Unstructured, enqueue Enqueue)
  - file: impl/informerwatch/informerwatch.go
    kind: method
    name: Reactor.Updated
    signature: Updated(kind string, old, obj *unstructured.Unstructured, enqueue Enqueue)
  - file: impl/informerwatch/informerwatch.go
    kind: struct
    name: Resource
    signature: "type Resource struct {\n\tKind string\n\n\tGVR schema.GroupVersionResource\n}"
  - file: impl/informerwatch/informerwatch.go
    kind: function
    name: Run
    signature: func Run(ctx context.Context, opts Options) error
  - file: impl/informerwatch/informerwatch.go
    kind: struct
    name: Source
    signature: "type Source struct {\n\tBase string\n\n\tResources []Resource\n}"
  name: impl-informerwatch
  requirements:
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    id: r.block-until-done
    level: MUST
    text: After all caches sync, Run must block on the context's Done channel and
      return nil when the context is cancelled.
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    id: r.client-per-source
    level: MUST
    text: Run must build one dynamic client per Source, with the client host set to
      the source Base (trailing slash trimmed) plus ref.APIPathPrefix and a wildcard,
      and must apply common/clientlimit to the rest config.
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    - type_alias:922cbb149aec17f0c3fd708c19ebcc25
    id: r.enqueue-own-object
    level: MUST
    text: 'Add and update events must enqueue the changed object itself: the handler
      resolves the object with cache.RefOf and calls Enqueue with the resource Kind
      and the resolved ref, doing nothing when the object yields no ref.'
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    - struct:591bf69eb781348c20c82bf16173a503
    id: r.indexers-applied
    level: MUST
    text: Registration must add Options.Indexers to the informer indexer when they
      are non-nil, and must fail with an error naming the Kind when the indexer cannot
      be added.
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    - struct:f606eb0070d5227633ed9759d17ac235
    id: r.kind-watched-once
    level: MUST
    text: Run must refuse a Kind that appears in more than one Resource, because the
      second watcher would replace the first one's index; the error names the Kind
      and says it is watched twice.
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    - struct:591bf69eb781348c20c82bf16173a503
    id: r.on-event-hook
    level: SHOULD
    text: The add and update handlers should call Options.OnEvent when it is non-nil,
      before any enqueue or reactor work.
  - codeRefs:
    - interface:69ae3bee91c7100683df536ca4bee1f1
    - method:19895db5d0e36b28d57bf850b23b04ad
    id: r.reactor-added
    level: MUST
    text: On an add event with Options.Reactor set, the handler must call Reactor.Added
      with the Kind, the object as *unstructured.Unstructured, and the enqueue function,
      but only when the object is an *unstructured.Unstructured.
  - codeRefs:
    - interface:69ae3bee91c7100683df536ca4bee1f1
    - method:965fbef5d03cd976d93d50b7588840e0
    id: r.reactor-updated
    level: MUST
    text: On an update event with Options.Reactor set, the handler must call Reactor.Updated
      with the Kind, the old object (as *unstructured.Unstructured when it converts,
      otherwise nil), the new object as *unstructured.Unstructured, and the enqueue
      function.
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    - struct:f606eb0070d5227633ed9759d17ac235
    id: r.register-per-resource
    level: MUST
    text: Run must register an event handler for every Resource of every Source on
      a filtered dynamic shared informer factory started with the context's Done channel.
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    id: r.run-requires-enqueue
    level: MUST
    text: 'Run must return the error "informerwatch: an enqueue function is required"
      when Options.Enqueue is nil.'
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    id: r.run-requires-rest-config
    level: MUST
    text: 'Run must return the error "informerwatch: a rest config is required" when
      Options.Config is nil.'
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    - struct:591bf69eb781348c20c82bf16173a503
    id: r.set-populated
    level: SHOULD
    text: Registration should add the informer indexer to Options.Set under the resource
      Kind when Set is non-nil.
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    - struct:ff54a13981e71b687c7ac0015b595ed9
    id: r.source-needs-base
    level: MUST
    text: 'Run must reject a Source whose Base is empty with the error "informerwatch:
      every source needs a base URL".'
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    - struct:ff54a13981e71b687c7ac0015b595ed9
    id: r.source-needs-resource
    level: MUST
    text: 'Run must reject a Source with no Resources with the error "informerwatch:
      every source needs at least one resource".'
  - codeRefs:
    - function:e7b0c39be09f14cf5d6e760c26e08195
    id: r.wait-for-sync
    level: MUST
    text: 'Run must wait for every started factory''s cache to sync; when a cache
      fails to sync it must return nil if the context is already done, and otherwise
      the error "informerwatch: the cache for %s did not sync" naming the resource.'
  upstream: self
- code:
  - impl/kcpstore/kcpstore.go
  - impl/kcpstore/kcpstore_test.go
  - impl/kcpstore/live_test.go
  - impl/kcpstore/paths.go
  id: sc.impl-kcpstore
  intent: 'This context exists so that consumers (controllers, admission, DNS, servicenames)
    have one place that knows how to reach kcp: URL shape, per-cluster client reuse,
    rate limiting, JSON decoding, status and finalizer patching, token minting, and
    workspace path resolution. The path cache is the newest part and it is deliberately
    conservative — it exists because a workspace path that failed to resolve must
    not be frozen into a wrong name, so only an answer that cannot change by asking
    again is stored.'
  interfaces:
  - file: impl/kcpstore/kcpstore.go
    kind: function
    name: IsNotFound
    signature: func IsNotFound(err error) bool
  - file: impl/kcpstore/kcpstore.go
