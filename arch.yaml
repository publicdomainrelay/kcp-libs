    context and an io.Writer so the same code path can be driven by a test that captures
    output instead of the terminal. The accompanying test asserts on the printed lines,
    which makes the example double as an integration check that the deno permission
    vocabulary, the exec runner''s argv layout, probe thresholds, ttl arithmetic,
