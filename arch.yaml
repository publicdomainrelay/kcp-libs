- code:
  - factory/admission/admission.go
  - factory/admission/admission_test.go
  id: sc.factory-admission
  intent: This context exists to describe the admission gate that sits between a queue
    and the workloads it schedules. It defines the Source port through which the gate
    reads cluster state (parent, siblings, capacity) without knowing any workload
    runtime, and the Admitter that turns those reads plus a lease table into a queue.Admission
    decision and into wake notifications for runs that have become eligible. It is
    the piece that enforces per-parent concurrency policy, so callers can ask whether
    a specific run may proceed and can be told which runs to wake once capacity frees
    up.
  interfaces:
  - file: factory/admission/admission.go
    kind: struct
    name: Admitter
    signature: type Admitter struct { opts Options }
  - file: factory/admission/admission.go
    kind: method
    name: Admitter.Admit
    signature: func (a *Admitter) Admit(ctx context.Context, run queue.Run) (queue.Admission,
      error)
  - file: factory/admission/admission.go
    kind: method
    name: Admitter.Leases
    signature: func (a *Admitter) Leases() *queue.Leases
  - file: factory/admission/admission.go
    kind: method
    name: Admitter.Wake
    signature: func (a *Admitter) Wake(ctx context.Context, parent ref.Ref) error
  - file: factory/admission/admission.go
    kind: function
    name: New
    signature: func New(opts Options) *Admitter
  - file: factory/admission/admission.go
    kind: struct
    name: Options
    signature: type Options struct { Source Source; Leases *queue.Leases; LeaseTTL
      time.Duration; Now func() time.Time; Lifecycle queue.Lifecycle; Wake func(kind
      string, r ref.Ref); RunKind string; ParentKind string }
  - file: factory/admission/admission.go
    kind: interface
    name: Source
    signature: type Source interface { Parent(ctx context.Context, run queue.Run)
      (ref.Ref, bool, error); Runs(ctx context.Context, parent ref.Ref) ([]queue.Run,
      error); Capacity(ctx context.Context, parent ref.Ref) (queue.Capacity, *queue.Blocker,
      error) }
  - file: factory/admission/admission.go
    kind: method
    name: Source.Capacity
    signature: func (Source) Capacity(ctx context.Context, parent ref.Ref) (queue.Capacity,
      *queue.Blocker, error)
  - file: factory/admission/admission.go
    kind: method
    name: Source.Parent
    signature: func (Source) Parent(ctx context.Context, run queue.Run) (ref.Ref,
      bool, error)
  - file: factory/admission/admission.go
    kind: method
    name: Source.Runs
    signature: func (Source) Runs(ctx context.Context, parent ref.Ref) ([]queue.Run,
      error)
  name: factory-admission
  requirements:
  - codeRefs:
    - interface:9c23d5af968c6dcd87d996b5fb785c81
    - method:9b26f8dc3db4f420718a3ae685d15ea8
    id: r.admit-grant
    level: MUST
    text: Admit must grant a lease for the run on the parent at the current time only
      when the resulting admission is both Gated and Allowed.
  - codeRefs:
    - function:4204d25ce951cefafd1bb89729e7bd03
    - method:9b26f8dc3db4f420718a3ae685d15ea8
    id: r.admit-no-parent
    level: MUST
    text: Admit must return an empty queue.Admission and a nil error when Source.Parent
      reports the run has no parent, and must propagate any error from Parent, Runs
      or Capacity without deciding.
  - codeRefs:
    - method:9b26f8dc3db4f420718a3ae685d15ea8
    - struct:c62339005d8ea8281d87db8bcb56a638
    id: r.admit-plan
    level: MUST
    text: Admit must build the observed phase map from the sibling runs, count reserved
      leases for the parent at the current time, add the candidate run to the sibling
      list only when it is absent, and return the queue.PlanIndex entry for that run's
      ref.
  - codeRefs:
    - method:e452266abf564c3d1e61f18fb3d426f6
    - struct:c62339005d8ea8281d87db8bcb56a638
    id: r.leases-accessor
    level: MUST
    text: Admitter.Leases must return the lease table held in the options.
  - codeRefs:
    - function:4204d25ce951cefafd1bb89729e7bd03
    - struct:3aede7d4f92074172612567f434a4408
    id: r.new-defaults
    level: MUST
    text: New must default Leases to queue.NewLeases(LeaseTTL) when nil and Now to
      time.Now when nil, and return an Admitter holding the resulting Options.
  - codeRefs:
    - struct:3aede7d4f92074172612567f434a4408
    - struct:c62339005d8ea8281d87db8bcb56a638
    id: r.options-shape
    level: MUST
    text: Options must carry Source, Leases, LeaseTTL, Now, Lifecycle, Wake, RunKind
      and ParentKind, and Admitter must hold those options unexported.
  - codeRefs:
    - interface:9c23d5af968c6dcd87d996b5fb785c81
    - method:d3904e1762452936d94101cc4cfc4bbe
    id: r.source-capacity
    level: MUST
    text: Source.Capacity must report the parent's capacity together with the blocker
      that limits it, so the plan can be computed and the limit derived.
  - codeRefs:
    - interface:9c23d5af968c6dcd87d996b5fb785c81
    - method:596d1d41bb4565e406b326020ce25a82
    id: r.source-parent
    level: MUST
    text: Source.Parent must report the parent of a run, with a boolean that is false
      when the run has no parent and an error that aborts the decision.
  - codeRefs:
    - file:factory/admission/admission.go
    - interface:9c23d5af968c6dcd87d996b5fb785c81
    id: r.source-port
    level: MUST
    text: Admission state must be read through the Source interface only, which exposes
      Parent, Runs and Capacity and names no workload runtime.
  - codeRefs:
    - interface:9c23d5af968c6dcd87d996b5fb785c81
    - method:0d37cff2d12a3e38aa4393696696d4c5
    id: r.source-runs
    level: MUST
    text: Source.Runs must list the runs already present under a parent, which the
      admitter uses to build the observed phase map and to size wake lists.
  - codeRefs:
    - file:factory/admission/admission_test.go
    id: r.test-coverage
    level: SHOULD
    text: The package should be exercised through a stub Source in tests, as factory/admission/admission_test.go
      does.
  - codeRefs:
    - method:fb3c595a96a98de51678ad45702f4519
    - struct:3aede7d4f92074172612567f434a4408
    id: r.wake-noop
    level: MUST
    text: Wake must return nil without touching the Source when no Wake callback is
      configured.
  - codeRefs:
    - method:fb3c595a96a98de51678ad45702f4519
    - struct:c62339005d8ea8281d87db8bcb56a638
    id: r.wake-parent
    level: SHOULD
    text: Wake should fire the Wake callback with ParentKind and the parent ref after
      the per-run wakes, and only when ParentKind is non-empty.
  - codeRefs:
    - method:d3904e1762452936d94101cc4cfc4bbe
    - method:fb3c595a96a98de51678ad45702f4519
    id: r.wake-runs
    level: MUST
    text: Wake must re-read the parent's runs and capacity, derive the limit from
      the capacity policy and max concurrency, and fire the Wake callback with RunKind
      for each run returned by queue.WakeList for the free slot count, where free
      is the limit minus the running count and is clamped at zero.
  upstream: self
- code:
  - factory/controller/controller.go
  - factory/controller/controller_test.go
  - factory/controller/events.go
  - factory/controller/live_test.go
  id: sc.factory-controller
  intent: 'This context is the controller runtime of kcp-libs: the generic work-queue
    driver that turns watched kcp resources into reconcile invocations. It exists
    so the deno workload packages and downstream consumers can share one tested scheduling
    core — bounded-concurrency workers, rate limited retries, optimistic-concurrency
    conflict handling, informer-event freshness tracking and prometheus metrics —
    instead of each rebuilding it. It names no workload runtime; the deno vocabulary
    lives in the consumers, and the controller only knows kinds, refs and a reconcile.Handler.'
  interfaces:
  - file: factory/controller/controller.go
    kind: struct
    name: Controller
    signature: type Controller struct
  - file: factory/controller/events.go
    kind: method
    name: Controller.CacheAge
    signature: func (c *Controller) CacheAge() time.Duration
  - file: factory/controller/controller.go
    kind: method
    name: Controller.Conflicts
    signature: func (c *Controller) Conflicts() uint64
  - file: factory/controller/controller.go
    kind: method
    name: Controller.Enqueue
    signature: func (c *Controller) Enqueue(kind string, r ref.Ref)
  - file: factory/controller/controller.go
    kind: method
    name: Controller.Errors
    signature: func (c *Controller) Errors() uint64
  - file: factory/controller/controller.go
    kind: method
    name: Controller.QueueDepth
    signature: func (c *Controller) QueueDepth() int
  - file: factory/controller/controller.go
    kind: method
    name: Controller.Reconciles
    signature: func (c *Controller) Reconciles() uint64
  - file: factory/controller/controller.go
    kind: method
    name: Controller.Run
    signature: func (c *Controller) Run(ctx context.Context) error
  - file: factory/controller/controller.go
    kind: function
    name: DefaultWorkers
    signature: func DefaultWorkers() int
  - file: factory/controller/controller.go
    kind: function
    name: New
    signature: func New(opts Options) (*Controller, error)
  - file: factory/controller/controller.go
    kind: struct
    name: Options
    signature: type Options struct
  name: factory-controller
  requirements:
  - codeRefs:
    - file:factory/controller/controller.go
    - function:9074c79f1f56d6b08908fad3482eacf7
    id: r.default-workers-clamped
    level: MUST
    text: DefaultWorkers returns runtime.GOMAXPROCS(0) clamped to the range 1 through
      16.
  - codeRefs:
    - file:factory/controller/controller.go
    - method:e5158999a5682e7a4c200ae884ceaaa7
    id: r.enqueue-key
    level: MUST
    text: Enqueue builds a reconcile.Key from the kind and a ref.New of the ref.Ref's
      LogicalCluster, Namespace and Name, and adds it to the rate limiting workqueue.
  - codeRefs:
    - file:factory/controller/events.go
    - method:e95e98357d5f3058033476c49387e673
    id: r.event-freshness
    level: SHOULD
    text: The OnEvent hook wired into informerwatch records the current Now timestamp
      so that CacheAge and cache_age_seconds reflect informer liveness.
  - codeRefs:
    - file:factory/controller/controller_test.go
    - file:factory/controller/live_test.go
    id: r.live-verification
    level: SHOULD
    text: The controller is exercised against a real kcp cluster by TestLiveControllerAgainstRealKCP
      using kcpstore and exportwatch wiring.
  - codeRefs:
    - file:factory/controller/controller.go
    - method:7b04bad45e95e9143fa55f0f8586bbdb
    - method:e95e98357d5f3058033476c49387e673
    - struct:6973c4a29350d7c92098bf48291ceafd
    id: r.metrics-families
    level: MUST
    text: New registers reconcile_seconds (summary), conflicts_total (counter), queue_depth
      (gauge function over the queue length) and cache_age_seconds (gauge function
      over CacheAge, reporting NaN before the first event) on the chosen metrics registry.
  - codeRefs:
    - file:factory/controller/controller.go
    - function:9074c79f1f56d6b08908fad3482eacf7
    - function:e71a19275883cd3b3727e16c601067ec
    id: r.new-defaults-options
    level: MUST
    text: 'New fills absent options: Policy.Interval from reconcile.DefaultRequeueAfter,
      Policy.MinTransitionPoll from reconcile.DefaultMinTransitionPoll, Workers from
      DefaultWorkers, Now from time.Now, Log from slog.Default, IsConflict from apierrors.IsConflict,
      Metrics from metrics.New("controller") and Set from cache.NewSet.'
  - codeRefs:
    - file:factory/controller/controller.go
    - function:e71a19275883cd3b3727e16c601067ec
    id: r.new-validates-wiring
    level: MUST
    text: 'New returns an error when Config is nil ("controller: a rest config is
      required"), when Handler is nil ("controller: a handler is required"), or when
      Sources is empty ("controller: at least one source is required"), and returns
      a usable *Controller otherwise.'
  - codeRefs:
    - file:factory/controller/events.go
    - method:1a8c9e2899cff2770239be37b7e2356e
    - method:627af13a96e55d3834be1684b1f3a926
    - method:ba8012ce4989a1a73fa61d029f34146c
    - method:e3736f862df6f3ade0940b347f611edb
    - method:e95e98357d5f3058033476c49387e673
    id: r.observability-readers
    level: MUST
    text: QueueDepth returns the workqueue length, Reconciles, Conflicts and Errors
      return the respective atomic counters, and CacheAge returns zero before the
      first informer event and otherwise the elapsed time from the last event to Now.
  - codeRefs:
    - file:factory/controller/controller.go
    - method:7b04bad45e95e9143fa55f0f8586bbdb
    id: r.run-supervises
    level: MUST
    text: Run starts informerwatch.Run in a goroutine with Config, Sources, Indexers,
      Set, Reactor, Enqueue and OnEvent wired from the options, starts one worker
      per Workers, then waits on ctx.Done() or the watch error channel; it shuts the
      queue down, waits for all workers, and returns the watch error unless it is
      context.Canceled.
  - codeRefs:
    - file:factory/controller/controller.go
    - method:7b04bad45e95e9143fa55f0f8586bbdb
    - struct:6973c4a29350d7c92098bf48291ceafd
    id: r.worker-conflict-path
    level: MUST
    text: A worker that receives an error matching opts.IsConflict increments the
      conflicts counter and the conflicts_total metric, forgets the key, re-queues
      it after Policy.ConflictAfter(), and does not increment the errors counter or
      log.
  - codeRefs:
    - file:factory/controller/controller.go
    - method:7b04bad45e95e9143fa55f0f8586bbdb
    id: r.worker-error-path
    level: MUST
    text: A worker that receives a non-conflict error increments the errors counter,
      logs "reconcile failed" with the kind, workspace, name and error, and re-queues
      the key rate limited; the handler call is timed into the reconcile_seconds summary.
  - codeRefs:
    - file:factory/controller/controller.go
    - method:7b04bad45e95e9143fa55f0f8586bbdb
    id: r.worker-success-path
    level: MUST
    text: A worker that handles a key without error forgets it, asks Policy.Next(key,
      after, terminal) for a delay and requeue decision, and re-queues the key after
      that delay only when requeue is true.
  upstream: self
- code:
  - factory/servicenames/servicenames.go
  - factory/servicenames/servicenames_test.go
  id: sc.factory-servicenames
  intent: This context exists so that workloads running under kcp can discover each
    other by name without a hand-written DNS configuration. It converts the pods a
    cluster controller already observes into a service table (name to advertised host:port),
    the workspace list worth addressing, and the service account tokens needed to
    reach them, then hands that whole bundle to a workload as environment variables.
    It also defines the seams (Source, PathResolver, TokenMinter) that keep the package
    free of any particular client, so a caller supplies real store-backed pods and
    paths while tests supply plain functions.
  interfaces:
  - file: factory/servicenames/servicenames.go
    kind: function
    name: AdvertisedAddress
    signature: func AdvertisedAddress(argsJSON, envJSON string) string
  - file: factory/servicenames/servicenames.go
    kind: function
    name: New
    signature: func New(opts Options) *Resolver
  - file: factory/servicenames/servicenames.go
    kind: struct
    name: Options
    signature: type Options struct { Source Source; Minter store.TokenMinter; Paths
      PathResolver; Domain string; TokenTTL time.Duration; ServiceAccountNamespace
      string; Shim string }
  - file: factory/servicenames/servicenames.go
    kind: interface
    name: PathResolver
    signature: type PathResolver interface { Lookup(ctx context.Context, logicalCluster
      string) string }
  - file: factory/servicenames/servicenames.go
    kind: method
    name: PathResolver.Lookup
    signature: Lookup(ctx context.Context, logicalCluster string) string
  - file: factory/servicenames/servicenames.go
