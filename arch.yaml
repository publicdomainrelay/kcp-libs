    kind: struct
    name: Store
    signature: type Store struct
  - file: impl/kcpstore/kcpstore.go
    kind: method
    name: Store.ClientFor
    signature: func (s *Store) ClientFor(logicalCluster string, gv schema.GroupVersion)
      (rest.Interface, error)
  - file: impl/kcpstore/kcpstore.go
    kind: method
