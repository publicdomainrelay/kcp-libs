    file: impl/execrunner/pod.go
  - name: Pod.Probe
    kind: method
    signature: func (p *Pod) Probe(ctx context.Context, runID string, command []string,
      timeout time.Duration) (bool, error)
    file: impl/execrunner/pod.go
  - name: Pod.Start
    kind: method
    signature: func (p *Pod) Start(_ context.Context, req runner.PodRequest) (string,
      error)
    file: impl/execrunner/pod.go
  - name: Pod.Stop
    kind: method
    signature: func (p *Pod) Stop(_ context.Context, runID string) error
    file: impl/execrunner/pod.go
  - name: PodOptions
    kind: struct
    signature: type PodOptions struct
