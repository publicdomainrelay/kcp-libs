    file: impl/execrunner/engine.go
  - name: NewPod
    kind: function
    signature: func NewPod(opts PodOptions) (*Pod, error)
    file: impl/execrunner/pod.go
  - name: Pod
    kind: struct
    signature: type Pod struct
    file: impl/execrunner/pod.go
  - name: Pod.Observe
    kind: method
    signature: func (p *Pod) Observe(_ context.Context, runID string) (runner.PodStatus,
