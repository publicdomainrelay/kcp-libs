apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: internal-livekcp
  namespace: default
spec:
  repository: kcp-libs
  upstream: self
  dependsOn:
  - sc.abc-store
  - sc.common-kcp
  - sc.common-ref
  - sc.internal-livekcp-livetest
  intent: This context exists so tests can run against a real kcp control plane instead
    of mocks, with a stable Go API for lifecycle, inspection, and object seeding.
    It separates tool discovery (Resolve, Missing) from cluster lifecycle (Start,
    Cluster.Stop) and from object manipulation (NewObject, Seed, WaitFor), so the
    live tier is opt-in and its prerequisites are checkable before a test starts.
  requirements:
  - id: r.borrow-kubeconfig
    level: SHOULD
    text: When the kubeconfig environment variable is set, Start borrows that existing
      cluster instead of spawning a new kcp server.
    codeRefs:
    - function:4b3f41640fb2b3e911c648141290c1d5
  - id: r.get-arbitrary-kubectl
    level: MUST
    text: Cluster.Get runs kubectl against the named logical cluster with the caller's
      arguments and returns the output or an error.
    codeRefs:
    - method:f0b8256f57bdba9e9dcac75d9241526b
  - id: r.kubectl-apply-manifest
    level: MUST
    text: Cluster.Kubectl applies the given manifest text to the named logical cluster
      and returns the command output or an error.
    codeRefs:
    - method:b5f2080a887dcbb09ef6f7bd666b9f35
  - id: r.logs-returns-captured-output
    level: MUST
    text: Cluster.Logs returns the captured log output of the cluster processes so
      startup failures can be reported with their cause.
    codeRefs:
    - method:3f02a0afbba672fa1173355e116c56ef
  - id: r.missing-reports-path-tools
    level: MUST
    text: Missing checks the resolved paths of "kcp" and "kubectl" with exec.LookPath
      and returns the names that are not found, so callers can skip or fail the live
      tier.
    codeRefs:
    - function:0a50cfde74a0f07654f738fa118ac451
    - function:d479362575f3e9bdc720a864f461337f
  - id: r.newobject-constructor
    level: MUST
    text: NewObject builds an Object for the given namespace and name with a populated
      metadata block.
    codeRefs:
    - function:5a4f9ce4422f0cec246c940b5283429f
  - id: r.object-metadata
    level: MUST
    text: Metadata and Object carry the namespace and name of a widget object so store
      operations can address it.
    codeRefs:
    - struct:999b971297c62644133dc6b3bc49d899
    - struct:a59ecf5482f57ec3af04d55abb5dd006
  - id: r.phase-record
    level: MUST
    text: Phase records a named startup step with its Name and Duration, and Cluster.Phases
      returns the recorded phases in order.
    codeRefs:
    - method:d103a880ccff094fe7f5b8caa6d5b1f3
    - struct:fe2a77c3271783da115f1571ba203765
  - id: r.resolve-env-override
    level: MUST
    text: Resolve returns the KCP_BIN value for name "kcp" and the KUBECTL value for
      name "kubectl" when those environment variables are set and non-empty, and otherwise
      returns the name unchanged.
    codeRefs:
    - function:0a50cfde74a0f07654f738fa118ac451
  - id: r.seed-writes-object
    level: MUST
    text: Seed writes the given object into the resource store at the cluster, namespace,
      and name, and returns the store error.
    codeRefs:
    - function:f491bc097912aca38e88dfb1fe89d625
  - id: r.start-lifecycle
    level: MUST
    text: Start builds a Cluster rooted in a temporary directory with a free port,
      a generated kubeconfig, and the provider, consumer, and second-consumer workspace
      names, and stops the cluster if startup does not complete.
    codeRefs:
    - function:4b3f41640fb2b3e911c648141290c1d5
    - method:e338fe1dc18ef9248055aff1a28946c4
    - struct:778309bad5d8b038278da322efb149ab
  - id: r.stop-terminates-processes
    level: MUST
    text: Cluster.Stop terminates the processes the cluster spawned so a failed or
      finished live run leaves nothing behind.
    codeRefs:
    - method:e338fe1dc18ef9248055aff1a28946c4
    - struct:778309bad5d8b038278da322efb149ab
  - id: r.trace-returns-trace
    level: SHOULD
    text: Cluster.Trace returns the cluster trace as a string for test assertions
      and diagnostics.
    codeRefs:
    - method:28d07dbfe29a3f8d8331039e1bbadc50
  - id: r.waitfor-polls-until-reached
    level: MUST
    text: WaitFor polls the store reader at the given cluster, namespace, and name
      until the reached predicate accepts the object, returning that object or an
      error when the context ends.
    codeRefs:
    - function:030637b2b22d16001b0b0236353e6613
  interfaces:
  - name: Cluster
    kind: struct
    signature: type Cluster struct
    file: internal/livekcp/livekcp.go
  - name: Cluster.Get
    kind: method
    signature: func (c *Cluster) Get(ctx context.Context, logicalCluster string, args
      ...string) (string, error)
    file: internal/livekcp/livekcp.go
  - name: Cluster.Kubectl
    kind: method
    signature: func (c *Cluster) Kubectl(ctx context.Context, logicalCluster, manifest
      string) (string, error)
    file: internal/livekcp/livekcp.go
  - name: Cluster.Logs
    kind: method
    signature: func (c *Cluster) Logs() string
    file: internal/livekcp/livekcp.go
  - name: Cluster.Phases
    kind: method
    signature: func (c *Cluster) Phases() []Phase
    file: internal/livekcp/livekcp.go
  - name: Cluster.Stop
    kind: method
    signature: func (c *Cluster) Stop()
    file: internal/livekcp/livekcp.go
  - name: Cluster.Trace
    kind: method
    signature: func (c *Cluster) Trace() string
    file: internal/livekcp/livekcp.go
  - name: Metadata
    kind: struct
    signature: type Metadata struct
    file: internal/livekcp/widget.go
  - name: Missing
    kind: function
    signature: func Missing() []string
    file: internal/livekcp/livekcp.go
  - name: NewObject
    kind: function
    signature: func NewObject[Spec, Status any](namespace, name string) *Object[Spec,
      Status]
    file: internal/livekcp/widget.go
  - name: Object
    kind: struct
    signature: type Object[Spec, Status any] struct
    file: internal/livekcp/widget.go
  - name: Phase
    kind: struct
    signature: type Phase struct { Name string; Duration time.Duration }
    file: internal/livekcp/livekcp.go
  - name: Resolve
    kind: function
    signature: func Resolve(name string) string
    file: internal/livekcp/livekcp.go
  - name: Seed
    kind: function
    signature: func Seed[T any](ctx context.Context, cluster string, resource store.Resource[T],
      namespace, name string, obj *T) error
    file: internal/livekcp/widget.go
  - name: Start
    kind: function
    signature: func Start(ctx context.Context) (*Cluster, error)
    file: internal/livekcp/livekcp.go
  - name: WaitFor
    kind: function
    signature: func WaitFor[T any](ctx context.Context, cluster string, resource store.Reader[T],
      namespace, name string, reached func(T) bool) (*T, error)
    file: internal/livekcp/widget.go
