apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: abc-queue
  namespace: default
spec:
  repository: kcp-libs
  upstream: self
  dependsOn:
  - sc.common-denocomputer
  - sc.common-expiringmap
  - sc.common-ref
  intent: 'This context exists to specify the admission/lease contract of the abc
    queue: what a Run must look like to be planned, how Policy defaults resolve, how
    a Capacity, Blocker and reserved count combine into a per-run Admission, and how
    held leases are scoped to a parent, counted against observed lifecycle phase,
    expired by TTL and released. It is the durable description of the queue''s pure
    decision functions and its lease bookkeeping, so consumers such as the deno process
    runner and the admission factory can rely on the same semantics without re-deriving
    them from the source.'
  requirements:
  - id: r.admission-waiting
    level: MUST
    text: Admission must report through Waiting whether the run it describes is still
      waiting for capacity rather than admitted.
    codeRefs:
    - method:8573365ee09dc1eb4cd105750db7d96a
    - struct:792cc17bc63ccca0dcb38c0a64474daf
  - id: r.decision-verdict
    level: MUST
    text: Decision must take a policy, an optional maxConcurrent override and the
      active and ahead counts, and return whether the run is admitted together with
      the reason strings that explain the verdict.
    codeRefs:
    - file:abc/queue/queue.go
    - function:1c23c59b39afb3955d8fb1ef8262bec4
  - id: r.leases-grant-forget-len
    level: MUST
    text: Leases must expose Grant to record a run under a parent at a given time,
      Forget to drop the entry for a run, and Len to report the number of live entries.
    codeRefs:
    - file:abc/queue/leases.go
    - method:7fcca607f05203909cae0e30fb95654f
    - method:aaa78ff0e7191ff1df4b246d1a69c083
    - method:ebdc3f4b76becb1059271eec51c5af14
  - id: r.leases-parent-scoped-count
    level: MUST
    text: Leases.Count must count only the leases granted against the given parent
      ref, so a lease held for one parent is never counted for another.
    codeRefs:
    - file:abc/queue/leases_test.go
    - method:a57993a5f26e81ef1e6ae695a11d798d
    - struct:ad8589e78e7c996950704e3f42b98e35
  - id: r.leases-release-on-observed
    level: MUST
    text: A lease must be released when the run it covers is present in the observed
      map and its phase, as read through the Lifecycle, is running or terminal, so
      that Count returns zero and Len drops the entry once both runs are observed.
    codeRefs:
    - method:a57993a5f26e81ef1e6ae695a11d798d
    - method:aaa78ff0e7191ff1df4b246d1a69c083
    - struct:34632297f34c7dcc187beda5485fdc49
  - id: r.leases-ttl-expiry
    level: MUST
    text: Leases must be created through NewLeases with a TTL, and every entry must
      expire once that TTL has elapsed so that an expired lease no longer contributes
      to the count.
    codeRefs:
    - file:abc/queue/leases.go
    - function:2ae018e0f488c4c38974fe6ac10ac6b7
    - struct:2f6663c79d6e6a401d99f363c4816759
  - id: r.limit-resolution
    level: MUST
    text: Limit must resolve a policy plus an optional maxConcurrent override into
      an effective concurrency limit and a flag saying whether that limit is unlimited.
    codeRefs:
    - file:abc/queue/queue.go
    - function:57b793729eefa74795369ef3ec3c5001
    - struct:47c532cd8b7218bfdb153ed7bf19aa12
  - id: r.plan-admissions
    level: MUST
    text: Plan must take the ordered runs together with capacity, an optional blocker,
      the reserved count and the lifecycle, and return one Admission per run, and
      PlanIndex must expose the same result keyed by ref.Ref.
    codeRefs:
    - function:a64e06cf0280d641c63e9d6a29889ba2
    - function:cb491319026f10dd31ad43cb1a74a3e6
    - struct:4921ee224c96b7635c2b202098cbeff3
    - struct:792cc17bc63ccca0dcb38c0a64474daf
  - id: r.policy-defaulting
    level: MUST
    text: Policy must be an alias resolved to usable defaults by EffectivePolicy,
      so a caller can pass a partially set or zero policy and receive a complete one.
    codeRefs:
    - file:abc/queue/queue.go
    - function:7ca241acd8161cba27ae96514598782f
    - type_alias:be31cbc6c94318d5c5589f1e679d3f21
  - id: r.queue-purity
    level: SHOULD
    text: 'The queue decision functions should stay pure and workload-agnostic: they
      take runs, capacity, policy and lifecycle as arguments and name no workload
      runtime.'
    codeRefs:
    - file:abc/queue/queue.go
    - file:abc/queue/queue_test.go
  - id: r.run-ordering
    level: MUST
    text: Order must sort a slice of runs in place into the queue's admission order
      before planning.
    codeRefs:
    - file:abc/queue/queue.go
    - function:4a7ac07571d725f388963144fc298480
    - struct:6dd8d61ae12efdab874719004a369656
  - id: r.wake-list
    level: MUST
    text: WakeList must return the refs of the runs that should be woken given the
      runs, the lifecycle, and either a limit or the unlimited flag.
    codeRefs:
    - file:abc/queue/queue.go
    - function:7c6d74ae07384500ff8262c7a120089c
    - struct:34632297f34c7dcc187beda5485fdc49
