apiVersion: specs.publicdomainrelay.dev/v1alpha1
codeRefIndex:
- file:common/denocomputer/denocomputer.go denocomputer.go@common/denocomputer/denocomputer.go
- file:common/denocomputer/denocomputer_test.go denocomputer_test.go@common/denocomputer/denocomputer_test.go
- function:0ac0b313ea9228a561bfd9f56465b4be TerminalPolicyWorkflow@common/denocomputer/denocomputer.go:87
- function:0d13333d7202e69c40af4472e0f2436b TerminalDenoPod@common/denocomputer/denocomputer.go:79
- function:36ff8f97f3450e32e33a6b3b0e493610 TerminalDenoJob@common/denocomputer/denocomputer.go:83
- function:67ee37b108a01a226ce8f48241d735b8 RunningPhase@common/denocomputer/denocomputer.go:95
- function:6e7c1837ac42c5ecd27e997607373d2d TerminalDenoRun@common/denocomputer/denocomputer.go:75
- function:8947f352a45e5a31be8d9bdad53c8a93 TerminalPolicyEngine@common/denocomputer/denocomputer.go:91
- type_alias:a265ac7a2b0813430059371d42a76985 Phase@common/denocomputer/denocomputer.go:55
kind: SystemContext
metadata:
  name: common-denocomputer
  namespace: default
spec:
  intent: This context exists to keep one copy of the deno.computer names and phases
    that both this generic library and the deno-kcp consumer agree on. Rather than
    letting the library invent its own group, finalizers, labels, conditions or phase
    strings, the constants live here and a test reads the consumer's own source as
    the source of truth and fails on any drift. The phase predicates sit beside the
    Phase type so callers in the reconcile paths can ask whether a run, pod, job,
    policy workflow or policy engine has finished without re-encoding which phases
    count as terminal in every call site.
  interfaces:
  - file: common/denocomputer/denocomputer.go
    kind: type_alias
    name: Phase
    signature: type Phase string
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: RunningPhase
    signature: func RunningPhase(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalDenoJob
    signature: func TerminalDenoJob(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalDenoPod
    signature: func TerminalDenoPod(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalDenoRun
    signature: func TerminalDenoRun(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalPolicyEngine
    signature: func TerminalPolicyEngine(phase string) bool
  - file: common/denocomputer/denocomputer.go
    kind: function
    name: TerminalPolicyWorkflow
    signature: func TerminalPolicyWorkflow(phase string) bool
  repository: kcp-libs
  requirements:
  - codeRefs:
    - file:common/denocomputer/denocomputer.go
    - file:common/denocomputer/denocomputer_test.go
    id: r.consumer-checkout-optional
    level: SHOULD
    text: The consumer-agreement tests should skip when the deno-kcp checkout is not
      next to this module, and should fail instead of skipping when KCP_LIBS_REQUIRE_CONSUMER
      is 1.
  - codeRefs:
    - file:common/denocomputer/denocomputer_test.go
    id: r.finalizers-match-consumer
    level: MUST
    text: Every finalizer string this module declares (FinalizerDenoRun, FinalizerDenoPod,
      FinalizerPolicyEngine, FinalizerPolicyWorkflowRun, FinalizerOpenBao) must be
      one the consumer declares; none may be invented.
  - codeRefs:
    - file:common/denocomputer/denocomputer_test.go
    id: r.group-and-version-match-consumer
    level: MUST
    text: Group, Version and the derived APIVersion must equal the GroupName and Version
      the deno-kcp consumer declares in its api/v1alpha1 package.
  - codeRefs:
    - file:common/denocomputer/denocomputer_test.go
    id: r.labels-match-consumer
    level: MUST
    text: PolicyWorkflowPodLabel, JobRunLabel and TriggerLabel must match the consumer's
      declared values; TriggerLabel may instead be accepted when the consumer names
      that exact literal anywhere in its Go source.
  - codeRefs:
    - type_alias:a265ac7a2b0813430059371d42a76985
    id: r.phase-is-string-alias
    level: MUST
    text: Phase is a string type, so phase constants and stored phase strings interchange
      through a plain string conversion.
  - codeRefs:
    - file:common/denocomputer/denocomputer_test.go
    id: r.phases-conditions-reasons-match-consumer
    level: MUST
    text: 'The phase, condition and reason strings this module declares must be the
      ones the consumer stores: DenoRunPending/Running/Succeeded/Failed, PolicyWorkflowCancelled,
      RunTriggerTriggered, the five Condition names, the two OpenBao conditions, and
      the three reason strings ReasonPolicyWorkflowPodMissing, ReasonEngineNotReady
      and ReasonQueued.'
  - codeRefs:
    - function:67ee37b108a01a226ce8f48241d735b8
    id: r.running-phase
    level: MUST
    text: RunningPhase(phase) must hold exactly when the phase is Running, and must
      not hold for a finished phase such as Succeeded.
  - codeRefs:
    - function:36ff8f97f3450e32e33a6b3b0e493610
    id: r.terminal-deno-job
    level: MUST
    text: TerminalDenoJob(phase) must hold for Succeeded and Failed, and must not
      hold for a run in flight such as Running or Pending.
  - codeRefs:
    - function:0d13333d7202e69c40af4472e0f2436b
    id: r.terminal-deno-pod
    level: MUST
    text: TerminalDenoPod(phase) must hold for Succeeded and Failed, and must not
      hold for a run in flight such as Running or Pending.
  - codeRefs:
    - function:6e7c1837ac42c5ecd27e997607373d2d
    id: r.terminal-deno-run
    level: MUST
    text: TerminalDenoRun(phase) must hold for Succeeded and Failed, and must not
      hold for Running or Pending.
  - codeRefs:
    - function:8947f352a45e5a31be8d9bdad53c8a93
    id: r.terminal-policy-engine
    level: MUST
    text: TerminalPolicyEngine(phase) must hold only for Failed; it must not hold
      for Running or for any other phase.
  - codeRefs:
    - function:0ac0b313ea9228a561bfd9f56465b4be
    id: r.terminal-policy-workflow
    level: MUST
    text: TerminalPolicyWorkflow(phase) must hold for Succeeded, Failed and Cancelled,
      so a cancelled policy run counts as terminal, unlike a cancelled plain run or
      pod.
  upstream: self
