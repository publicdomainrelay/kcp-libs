apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: factory-servicenames
  namespace: default
spec:
  repository: kcp-libs
  upstream: self
  dependsOn:
  - sc.abc-store
  - sc.common-denospec
  - sc.common-kcp
  - sc.common-ref
  intent: 'This context exists so that workloads running under kcp can discover each
    other by name without a hand-written DNS configuration. It converts the pods a
    cluster controller already observes into a service table (name to advertised host:port),
    the workspace list worth addressing, and the service account tokens needed to
    reach them, then hands that whole bundle to a workload as environment variables.
    It also defines the seams (Source, PathResolver, TokenMinter, the workspace source)
    that keep the package free of any particular client, so a caller supplies real
    store-backed pods, paths and workspaces while tests supply plain functions. The
    token map and the service names agree on one cluster naming on purpose: a workload
    discovers a peer by parsing the peer''s name back to its cluster and looking the
    token up by it, so a token keyed any other way is a peer it can never reach.'
  requirements:
  - id: r.advertised-address
    level: MUST
    text: AdvertisedAddress parses the args JSON as a string list and the env JSON
      as a string map, prefers the --port and --hostname flag values over PORT and
      HOSTNAME, returns the empty string when no port is found, and substitutes 127.0.0.1
      when the host is empty, "0.0.0.0" or "::"; the result is host:port.
    codeRefs:
    - function:8a334a3b9191ecba1125496302619eef
  - id: r.behaviour-is-tested
    level: MUST
    text: The package behaviour is covered by tests in the same package, including
      the table path lookup, the self name carried before the pod is observed, the
      shim preload entry, and per-workspace token minting.
    codeRefs:
    - file:factory/servicenames/servicenames.go
    - file:factory/servicenames/servicenames_test.go
  - id: r.env-bundle
    level: MUST
    text: Resolver.Env always sets the domain and the target namespace, sets the shim
      key only when Options.Shim is non-empty, adds the JSON table only when the table
      is non-empty, adds the tokens key whenever an account is given, and folds the
      target's own advertised address into the table and the workspace list when that
      address is non-empty.
    codeRefs:
    - method:bfae8f5500472858636c6d1c013433aa
  - id: r.name-uses-path
    level: MUST
    text: Resolver.Name routes the logical cluster through the PathResolver when one
      is set and it returns a non-empty path, and otherwise uses the logical cluster
      unchanged, then returns kcp.ServiceFQDN of name, namespace and cluster under
      the configured domain.
    codeRefs:
    - method:fde6488c215fafdc9b615405664720f8
  - id: r.new-defaults
    level: MUST
    text: New fills Options.Domain with kcp.DefaultServiceDomain and Options.ServiceAccountNamespace
      with "default" when either is empty, and returns a Resolver holding the resulting
      options.
    codeRefs:
    - function:37ab5725bd1c20dbfd19a629daa2966c
    - struct:6a9fe9f2761d8754abd4ba3af073a35f
    - struct:dd81ce362a0aa33a9ebf018c6e22efaa
  - id: r.path-resolver-lookup
    level: MUST
    text: A PathResolver maps a logical cluster to a path, returning the empty string
      when it has no answer, and PathResolverFunc adapts a function with the same
      signature.
    codeRefs:
    - interface:c70a17259fae28f88b3e1922fd769641
    - method:9fac36ee8b8d24e43bbc4732929d149c
    - method:cae3fb88acdade71c05e6f034630da80
    - type_alias:18970bc4f4801584a91a93a1396a18a1
  - id: r.source-provides-pods
    level: MUST
    text: A Source returns the observed pods as a slice of unstructured objects, and
      SourceFunc adapts a plain function to that interface by calling it.
    codeRefs:
    - interface:3f1bd9500073f2f4d05118ef71f4e7fa
    - method:9f382eff81d8cc14c42263ff6cc96655
    - method:ec3d149f59e5f08d064d8abb43c7b47e
    - type_alias:3403f9a23dfea8c2fabcfb5d23057f58
  - id: r.table-skips-unlabelled-and-unadvertised
    level: MUST
    text: Resolver.Table returns an empty table and no workspaces when no Source is
      set; it skips pods lacking the kcp.ClusterAnnotation, records each distinct
      cluster once in the returned workspace list in first-seen order, skips pods
      whose advertised address is empty, and maps each remaining pod's resolved name
      to its advertised address.
    codeRefs:
    - method:edee24a98f35bb7511a0389d67d2ebbf
  - id: r.token-keys-agree-with-the-service-name
    level: MUST
    text: Every key in the token JSON is the same cluster string Resolver.Name builds
      the service name from for that cluster -- the path the PathResolver answers
      when it answers a non-empty path, and the cluster unchanged otherwise. A workload
      parses a service name back to that cluster (pds.default.alice.svc.kcp.local
      to root:alice) and looks its token up by it, so a key that is an unresolved
      cluster id, or a cluster named any other way, is a lookup the workload can never
      hit and a peer it can never discover.
    codeRefs:
    - method:21dae96a0de0787a3171d9b273266bc6
  - id: r.tokens-per-workspace
    level: MUST
    text: Resolver.Tokens mints one service account token per workspace against the
      account's namespace, falling back to Options.ServiceAccountNamespace when the
      account namespace is empty, skips workspaces whose mint fails, and returns the
      result as a JSON object string, or "{}" when marshalling fails. It mints nothing
      when the account is nil or no Minter is set.
    codeRefs:
    - method:21dae96a0de0787a3171d9b273266bc6
  - id: r.workspace-source-tests
    level: MUST
    text: Tests cover it. Naming a cluster that has no pod still mints a token under
      the key the service name for that cluster implies, the target's own cluster
      is always in the set, a nil source adds nothing, and a cluster named twice is
      minted once.
    codeRefs:
    - file:factory/servicenames/servicenames_test.go
  - id: r.workspace-source-widens-the-token-set
    level: MUST
    text: Options carries a workspace source -- an interface whose Clusters method
      returns the logical clusters a workload may address, and no clusters when it
      has no answer. The set of workspaces a token is minted for is the union of the
      clusters the table names, the target's own cluster, and the clusters that source
      returns, deduplicated. A cluster with no pod yet is therefore still given a
      token, which is what lets a workload discover a service created after it started
      by name; a nil source leaves the set exactly as the table and the target make
      it.
    codeRefs:
    - struct:6a9fe9f2761d8754abd4ba3af073a35f
