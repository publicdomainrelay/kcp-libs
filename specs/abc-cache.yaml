  requirements:
  - codeRefs:
    - method:2f035c41d933e105b559d662a9a88767
    - method:436e0dc34ebdec584138d188650d491e
    id: r.byindex-skips-errors
    level: MUST
    text: Set.ByIndex concatenates ByIndex results across the indexers of a kind and
      skips any indexer that returns an error, so one failing store cannot fail the
      whole lookup.
  - codeRefs:
    - function:ac84053b66aaf34b0c83c98bd076de38
    id: r.decode-to-type
    level: SHOULD
    text: Decode turns an unstructured object into a typed value, returning an error
      when the conversion fails.
  - codeRefs:
    - method:3cf5981edb352b4ae0f722e3ed6bb96c
    - method:7dedfffcc434baa8546c274ac5fa4131
    id: r.get-first-hit
    level: MUST
    text: Set.Get asks the indexers of a kind in registered order and returns the
      first object whose GetByKey reports exists, with false when no indexer has it.
  - codeRefs:
    - interface:83657a0a0b8c546e00b0f6ddd68c8e0a
    - method:2f035c41d933e105b559d662a9a88767
    - method:3cf5981edb352b4ae0f722e3ed6bb96c
    - method:e8d2e2d111f92694f5202ff04b380d0c
    id: r.indexer-contract
    level: MUST
    text: 'An Indexer offers exactly three reads: GetByKey for one key with an exists
      flag and an error, ByIndex for the objects carrying a value under a named index,
      and List for all objects.'
  - codeRefs:
    - method:79db186239dd9ebf94db73d3c1834051
    - method:e8d2e2d111f92694f5202ff04b380d0c
    id: r.list-concatenates
    level: MUST
    text: Set.List returns the concatenation of List from every indexer registered
      under a kind.
  - codeRefs:
    - function:368cfc3b7333cde3fc16c28b5f4a251e
    - method:995ab025f452ec7f8d6ac24f85f6bbba
    - struct:b3ef85326db0e635df938cf47a312813
    id: r.multi-indexer-registry
    level: MUST
    text: A Set holds a list of indexers per object kind. Set.Add appends an Indexer
      under a kind, so several stores can back the same kind.
  - codeRefs:
    - function:53a9fed74460c17bc06521cc3e273e8c
    - method:23f07591814f8acee78325cb538a547d
    id: r.names-from-index
    level: MUST
    text: Set.Names returns the names of the objects found at an index value through
      Set.ByIndex, using NameOf on each object.
  - codeRefs:
    - function:cf99478a03753478fb8bd3cc621df402
    id: r.nested-field-walk
    level: MUST
    text: NestedString walks a list of nested field names on an object and returns
      the string found there.
  - codeRefs:
