apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: impl-assets
  namespace: default
spec:
  repository: kcp-libs
  upstream: self
  dependsOn:
  - sc.common-denospec
  intent: This context exists so callers can hand a declarative set of asset files
    to one object and get back a stable name-to-path map, without caring when or how
    often the bytes hit disk. It separates one-shot materialisation, which is idempotent
    and retried after failure, from explicit rewriting, which always writes, and it
    gives the DNS workload a ready-made set for its shim and probe scripts.
  requirements:
  - id: r.dns-assets-embedded
    level: MUST
    text: The shim and probe scripts shipped for the DNS workload live in the package
      as dnsshim.ts and dnsprobe.ts and are the bytes written by DNSSet.
    codeRefs:
    - file:impl/assets/dnsprobe.ts
    - file:impl/assets/dnsshim.ts
  - id: r.dnsset-builds-run-dir-set
    level: MUST
    text: DNSSet builds a Set whose Dir is the DNS directory under the given runs
      directory and whose Files carry the shim source under ShimName and the probe
      source under ProbeName.
    codeRefs:
    - file:impl/assets/dns.go
    - function:d3ebda2faf6210986c5ca5687c578339
  - id: r.dnsshim-discovers-a-name-absent-from-the-table-test
    level: MUST
    text: A deno test covers discovery, in the way the shim's other behaviour is covered.
      With a table that does not name the target, a token map that carries the target's
      cluster, and a local API server answering the target's denopod object, a fetch
      of the target's service name reaches the object's advertised address. With the
      same server and table but a token map keyed by the cluster id instead, the fetch
      reports that the name could not be discovered -- the key mismatch this guards
      against -- and no request is sent.
    codeRefs:
    - file:impl/assets/dns_test.go
    - file:impl/assets/dnsshim.ts
  - id: r.dnsshim-fetch-preserves-the-request
    level: MUST
    text: 'The shim replaces globalThis.fetch, and when the name it is given is in
      the table it must forward the caller''s request unchanged apart from the connection
      target. A caller that passes a Request object must reach the real fetch as that
      same request aimed at the table address: its method, body, headers, redirect
      mode, credentials, signal and cache mode are preserved. It must not be forwarded
      as a bare URL with an empty init, which drops the Request and turns a POST into
      a GET -- a service that routes by method then answers 404 for a write that was
      meant to create a resource, which is what a DID registration did. A caller that
      passes a URL and an init keeps working exactly as before, the Host header the
      shim adds carries the original name, and a name outside the table is still passed
      through untouched.'
    codeRefs:
    - file:impl/assets/dnsshim.ts
  - id: r.dnsshim-fetch-preserves-the-request-test
    level: MUST
    text: A test covers it, in the way the shim's other behaviour is covered -- deno
      runs the shim with the table pointed at a local listener, a driver calls fetch
      with a Request object whose method is not GET and whose body is known, and the
      listener records what it received. The test asserts the listener saw that method
      and that body, and it must fail against the shim before this requirement.
    codeRefs:
    - file:impl/assets/dns_test.go
    - file:impl/assets/dnsshim.ts
  - id: r.dnsshim-token-key-matches-the-name
    level: MUST
    text: When a name is absent from the table the shim falls back to discovery, and
      it reads the token for the target from the injected token map under the cluster
      it derives from the service name itself (pds.default.alice.svc.kcp.local to
      root:alice) -- the same cluster the provider keyed that token by. It must not
      read it under the raw cluster id or any other key, and when the map holds no
      token for that cluster it gives up instead of sending an unauthenticated request.
    codeRefs:
    - file:impl/assets/dnsshim.ts
  - id: r.materialise-failure-retried
    level: MUST
    text: A failed Materialise leaves the set unwritten and stores the error, so a
      later Materialise attempt writes again instead of returning the cached failure.
    codeRefs:
    - file:impl/assets/assets.go
    - method:459575a1ced2aec2dc09df6c846496d1
  - id: r.materialise-writes-once
    level: MUST
    text: Set.Materialise writes the files only when the set has not already been
      written, records success in written, and returns the published name-to-path
      map with the recorded error.
    codeRefs:
    - file:impl/assets/assets.go
    - method:459575a1ced2aec2dc09df6c846496d1
  - id: r.path-resolves-one-file
    level: MUST
    text: Set.Path returns the on-disk path of the named asset, materialising the
      set first, and reports an error for a name the set does not carry.
    codeRefs:
    - file:impl/assets/assets.go
    - method:dfdb88e0a88513d22977521f62fadc3c
  - id: r.rewrite-always-writes
    level: MUST
    text: Set.Rewrite writes the files on every call, ignoring the written flag, and
      marks the set written on success or unwritten on failure.
    codeRefs:
    - file:impl/assets/assets.go
    - method:621b8207809a46a163d2af9949761ea0
  - id: r.set-carries-dir-files-perm
    level: MUST
    text: Set exposes Dir, Files (name to bytes), and Perm so a caller can declare
      where assets go, what they contain, and what mode they get.
    codeRefs:
    - file:impl/assets/assets.go
    - struct:6a6e6a1cca0d3f0928da5e266ee9e2da
  - id: r.set-is-concurrency-safe
    level: MUST
    text: Set guards its written flag, path cache, and error with a mutex so concurrent
      Materialise, Rewrite, and Path calls stay consistent.
    codeRefs:
    - file:impl/assets/assets.go
    - struct:6a6e6a1cca0d3f0928da5e266ee9e2da
  interfaces:
  - name: DNSSet
    kind: function
    signature: func DNSSet(runsDir string) *Set
    file: impl/assets/dns.go
  - name: Set
    kind: struct
    signature: type Set struct { Dir string; Files map[string][]byte; Perm os.FileMode;
      mu sync.Mutex; written bool; paths map[string]string; err error }
    file: impl/assets/assets.go
  - name: Set.Materialise
    kind: method
    signature: func (s *Set) Materialise() (map[string]string, error)
    file: impl/assets/assets.go
  - name: Set.Path
    kind: method
    signature: func (s *Set) Path(name string) (string, error)
    file: impl/assets/assets.go
  - name: Set.Rewrite
    kind: method
    signature: func (s *Set) Rewrite() (map[string]string, error)
    file: impl/assets/assets.go
codeRefIndex:
- file:impl/assets/assets.go assets.go@impl/assets/assets.go
- file:impl/assets/assets_test.go assets_test.go@impl/assets/assets_test.go
- file:impl/assets/dns.go dns.go@impl/assets/dns.go
- file:impl/assets/dns_test.go dns_test.go@impl/assets/dns_test.go
- file:impl/assets/dnsprobe.ts dnsprobe.ts@impl/assets/dnsprobe.ts
- file:impl/assets/dnsshim.ts dnsshim.ts@impl/assets/dnsshim.ts
- function:d3ebda2faf6210986c5ca5687c578339 DNSSet@impl/assets/dns.go:18
- method:459575a1ced2aec2dc09df6c846496d1 Set.Materialise@impl/assets/assets.go:30
- method:621b8207809a46a163d2af9949761ea0 Set.Rewrite@impl/assets/assets.go:44
- method:dfdb88e0a88513d22977521f62fadc3c Set.Path@impl/assets/assets.go:65
- struct:6a6e6a1cca0d3f0928da5e266ee9e2da Set@impl/assets/assets.go:12
