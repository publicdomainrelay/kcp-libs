    id: r.health-mapping
    level: MUST
    text: Health queries sys/health and returns a pki.Health carrying initialized,
      sealed, standby and version; a transport failure is translated into a ResponseError
      naming GET sys/health.
  - codeRefs:
    - method:6ff60253ccaf2e7c0441bd69c2ba6e7f
