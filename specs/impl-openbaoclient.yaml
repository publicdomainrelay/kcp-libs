kind: SystemContext
metadata:
  name: impl-openbaoclient
  namespace: default
spec:
  dependsOn:
  - sc.abc-pki
  intent: This context exists so that the rest of the library can treat OpenBao as
    one interchangeable PKI backend behind a narrow Go surface. It separates OpenBao's
    REST and HTTP error vocabulary from the domain types (pki.Health, pki.RootCA,
    pki.IntermediateCSR, pki.Role, pki.Cert, pki.CertRequest), so consumers never
    import the OpenBao SDK or inspect status codes, and so the same PKI workflows
    can be exercised against an in-process test server.
